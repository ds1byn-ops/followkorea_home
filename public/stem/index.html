<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cell Vitality Program — Stem Cell Wellness in Seoul | FOLLOW KOREA</title>
<meta name="description" content="A concierge-managed stem cell wellness program at partner clinics in Gangnam, Seoul. Government-registered international patient facilitator. Personalised quote on request.">
<meta name="robots" content="index,follow">
<meta property="og:title" content="Cell Vitality Program — FOLLOW KOREA">
<meta property="og:description" content="Stem cell wellness programs with partner clinics in Gangnam, Seoul. 1:1 concierge, interpretation, personalised quote on request.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://followkorea.co.kr/stem/">
<meta property="og:image" content="https://followkorea.co.kr/og-image.png">
<meta name="twitter:card" content="summary_large_image">
<link rel="canonical" href="https://followkorea.co.kr/stem/">
<link rel="alternate" hreflang="en" href="https://followkorea.co.kr/stem/">
<link rel="alternate" hreflang="ko" href="https://followkorea.co.kr/stem/?lang=ko">
<link rel="alternate" hreflang="zh" href="https://followkorea.co.kr/stem/?lang=zh">
<link rel="alternate" hreflang="ja" href="https://followkorea.co.kr/stem/?lang=ja">
<link rel="alternate" hreflang="ru" href="https://followkorea.co.kr/stem/?lang=ru">
<link rel="alternate" hreflang="x-default" href="https://followkorea.co.kr/stem/">
<link rel="icon" href="/favicon.ico">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
:root{--gold:#B08D3F;--gold-d:#8A6B26;--gold-l:#E8D9B5;--ink:#2A2420;--mute:#857A6C;--line:#EDE4D3;--bg:#FBF8F3;--card:#fff;}
*{margin:0;padding:0;box-sizing:border-box;}
html{scroll-behavior:smooth;}
body{font-family:'Pretendard','Apple SD Gothic Neo','PingFang SC','Hiragino Sans','Malgun Gothic',sans-serif;background:var(--bg);color:var(--ink);line-height:1.65;word-break:keep-all;overflow-wrap:break-word;-webkit-text-size-adjust:100%;}
.wrap{max-width:1060px;margin:0 auto;padding:0 18px;}
.sec{padding:60px 0;}
.sec.alt{background:#fff;border-top:1px solid var(--line);border-bottom:1px solid var(--line);}
.eyebrow{font-size:11.5px;letter-spacing:.26em;font-weight:700;color:var(--gold);text-transform:uppercase;}
h2{font-size:clamp(21px,3.6vw,29px);font-weight:800;letter-spacing:-.4px;margin-top:8px;}
h3{font-size:16px;font-weight:800;}
.sub{color:var(--mute);font-size:14px;margin-top:9px;max-width:720px;}
/* top */
.top{background:rgba(255,255,255,.94);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:50;}
.top .wrap{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:60px;flex-wrap:wrap;padding-top:8px;padding-bottom:8px;}
.brand{display:flex;align-items:center;gap:9px;text-decoration:none;color:var(--ink);}
.brand img{height:22px;display:block;}
.brand span{font-size:12.5px;letter-spacing:.2em;font-weight:700;color:var(--gold-d);}
.right{display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:flex-end;}
.langs{display:flex;gap:4px;flex-wrap:wrap;}
.langs button{border:1px solid var(--line);background:#fff;border-radius:7px;padding:5px 9px;font-size:11.5px;font-weight:700;color:#6b6054;cursor:pointer;font-family:inherit;}
.langs button.on{border-color:var(--gold);background:#FBF3E2;color:var(--gold-d);}
.adbadge{font-size:10px;color:var(--mute);border:1px solid var(--line);border-radius:99px;padding:3px 9px;white-space:nowrap;}
/* hero */
.hero{background:linear-gradient(180deg,#fff 0%,#FAF4E9 100%);border-bottom:1px solid var(--line);padding:56px 0 50px;}
.hero .eyebrow{letter-spacing:.3em;}
.hero h1{font-size:clamp(27px,5.2vw,44px);font-weight:900;letter-spacing:-1.1px;line-height:1.3;margin-top:14px;}
.hero h1 b{color:var(--gold-d);font-weight:900;}
.hero .lead{margin-top:16px;font-size:clamp(14px,2.3vw,16px);color:var(--mute);max-width:660px;}
.hbadges{display:flex;gap:8px;flex-wrap:wrap;margin-top:22px;}
.hbadges span{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;color:var(--gold-d);background:#fff;border:1px solid var(--gold-l);border-radius:99px;padding:6px 13px;}
.hbadges i{width:6px;height:6px;border-radius:50%;background:var(--gold);flex:none;}
.cta{display:inline-block;margin-top:26px;background:linear-gradient(135deg,#C6A253,#8A6B26);color:#fff;font-weight:800;font-size:15px;padding:14px 32px;border-radius:11px;text-decoration:none;box-shadow:0 10px 26px rgba(138,107,38,.26);border:none;cursor:pointer;font-family:inherit;}
.cta.sm{font-size:13px;padding:10px 20px;margin-top:0;box-shadow:none;}
.cta.ghost{background:#fff;color:var(--gold-d);border:1px solid var(--gold-l);box-shadow:none;}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-top:34px;}
.st{background:#fff;border:1px solid var(--line);border-radius:12px;padding:15px 14px;text-align:center;}
.st .n{font-size:clamp(17px,2.6vw,23px);font-weight:900;color:var(--gold-d);}
.st .l{font-size:11px;color:var(--mute);margin-top:2px;line-height:1.45;}
/* grids */
.g3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin-top:26px;}
.g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin-top:26px;}
.box{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px;}
.box .num{font-size:11px;font-weight:800;color:var(--gold);letter-spacing:.14em;}
.box h3{margin-top:7px;}
.box p{font-size:13.5px;color:var(--mute);margin-top:7px;}
.lst{list-style:none;margin-top:14px;display:grid;gap:9px;}
.lst li{font-size:13.5px;color:#54493f;padding-left:17px;position:relative;}
.lst li:before{content:'';position:absolute;left:0;top:8px;width:6px;height:6px;border-radius:50%;background:var(--gold-l);border:1px solid var(--gold);}
/* program cards */
.series{margin-top:30px;}
.series h3.sname{font-size:13px;letter-spacing:.24em;font-weight:800;color:var(--gold-d);border-bottom:1px solid var(--line);padding-bottom:9px;}
.series p.sdesc{font-size:13.5px;color:var(--mute);margin-top:11px;}
.pcards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin-top:16px;}
.pc{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px;display:flex;flex-direction:column;}
.pc.feat{border-color:var(--gold);box-shadow:0 10px 28px rgba(176,141,63,.12);}
.pc .tier{font-size:10.5px;font-weight:800;letter-spacing:.16em;color:var(--gold);text-transform:uppercase;}
.pc .pname{font-size:21px;font-weight:900;letter-spacing:-.3px;margin-top:5px;}
.pc ul{list-style:none;margin-top:13px;display:grid;gap:8px;flex:1;}
.pc ul li{font-size:13px;color:#54493f;padding-left:15px;position:relative;line-height:1.55;}
.pc ul li:before{content:'◆';position:absolute;left:0;top:0;font-size:8px;color:var(--gold);line-height:2;}
.pc .meta{margin-top:14px;padding-top:12px;border-top:1px dashed var(--line);font-size:12px;color:var(--mute);display:grid;gap:4px;}
.pc .price{margin-top:12px;font-size:12.5px;font-weight:700;color:var(--gold-d);background:#FBF3E2;border:1px solid var(--gold-l);border-radius:9px;padding:9px 12px;text-align:center;}
.pc .pbtn{margin-top:10px;width:100%;text-align:center;}
.optwrap{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px;}
.optwrap span{font-size:12.5px;background:#fff;border:1px solid var(--line);border-radius:99px;padding:7px 14px;color:#54493f;}
/* clinics */
.ccards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;margin-top:26px;}
.cc{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column;}
.cc .ph{width:100%;aspect-ratio:16/10;object-fit:cover;background:#F1EADD;display:block;}
.cc .mono{width:100%;aspect-ratio:16/10;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#F7F0E1,#E9DBBE);color:var(--gold-d);font-size:clamp(17px,2.2vw,25px);font-weight:900;letter-spacing:.16em;text-align:center;padding:0 12px;line-height:1.25;}
.cc .bd{padding:15px 17px 18px;display:flex;flex-direction:column;flex:1;}
.cc .cn{font-size:15.5px;font-weight:800;letter-spacing:-.2px;line-height:1.4;}
.cc .cd{font-size:11.5px;color:var(--gold-d);font-weight:700;margin-top:5px;letter-spacing:.02em;}
.cc .cl{font-size:11.5px;color:var(--mute);margin-top:2px;}
.cc ul{list-style:none;margin-top:11px;display:grid;gap:6px;flex:1;}
.cc ul li{font-size:12.5px;color:#54493f;padding-left:14px;position:relative;line-height:1.5;}
.cc ul li:before{content:'\25C6';position:absolute;left:0;top:0;font-size:7px;color:var(--gold);line-height:2.2;}
/* glossary */
.gloss{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 28px;margin-top:22px;}
.gi{padding:13px 0;border-bottom:1px solid var(--line);}
.gi b{font-size:13.5px;font-weight:800;}
.gi p{font-size:12.5px;color:var(--mute);margin-top:3px;}
/* wizard */
.wz{background:#fff;border:1px solid var(--gold-l);border-radius:18px;padding:clamp(20px,3.6vw,34px);margin-top:26px;box-shadow:0 14px 40px rgba(138,107,38,.09);}
.steps{display:flex;gap:6px;margin-bottom:22px;flex-wrap:wrap;}
.steps div{flex:1;min-width:52px;height:4px;border-radius:99px;background:var(--line);}
.steps div.on{background:var(--gold);}
.stt{font-size:17px;font-weight:800;}
.sts{font-size:13px;color:var(--mute);margin-top:6px;}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px;}
.chip{border:1px solid var(--line);background:#fff;border-radius:10px;padding:10px 14px;font-size:13px;font-weight:600;color:#54493f;cursor:pointer;font-family:inherit;text-align:left;line-height:1.4;}
.chip.on{border-color:var(--gold);background:#FBF3E2;color:var(--gold-d);font-weight:800;}
.chip small{display:block;font-size:11px;font-weight:500;color:var(--mute);margin-top:2px;}
.chip.on small{color:var(--gold-d);opacity:.85;}
.fld{margin-top:14px;}
.fld label{display:block;font-size:12.5px;font-weight:700;margin-bottom:6px;}
.fld input,.fld select,.fld textarea{width:100%;border:1px solid var(--line);border-radius:10px;padding:11px 13px;font-size:14px;font-family:inherit;background:#fff;color:var(--ink);}
.fld input:focus,.fld select:focus,.fld textarea:focus{outline:none;border-color:var(--gold);}
.fld textarea{min-height:84px;resize:vertical;}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.wbtns{display:flex;gap:9px;margin-top:20px;flex-wrap:wrap;}
.wbtns button{border:none;border-radius:10px;padding:12px 24px;font-size:14px;font-weight:800;cursor:pointer;font-family:inherit;}
.bprev{background:#fff;border:1px solid var(--line);color:#6b6054;}
.bnext{background:linear-gradient(135deg,#C6A253,#8A6B26);color:#fff;}
.bnext:disabled{opacity:.55;cursor:not-allowed;}
.werr{color:#C0392B;font-size:12.5px;margin-top:10px;min-height:17px;}
.note{font-size:11.5px;color:var(--mute);margin-top:14px;line-height:1.6;}
.done{text-align:center;padding:14px 0;}
.done .ic{font-size:40px;color:var(--gold);}
.done h3{font-size:20px;margin-top:10px;}
.done p{font-size:13.5px;color:var(--mute);margin-top:9px;}
/* faq */
.faq{margin-top:22px;border-top:1px solid var(--line);}
.fq{border-bottom:1px solid var(--line);}
.fq button{width:100%;background:none;border:none;text-align:left;padding:16px 30px 16px 0;font-size:14.5px;font-weight:700;cursor:pointer;position:relative;font-family:inherit;color:var(--ink);line-height:1.5;}
.fq button:after{content:'+';position:absolute;right:4px;top:15px;color:var(--gold);font-size:18px;font-weight:400;}
.fq.open button:after{content:'−';}
.fq p{display:none;font-size:13.5px;color:var(--mute);padding:0 0 17px;}
.fq.open p{display:block;}
/* journey */
.jr{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin-top:26px;}
.jc{background:#fff;border:1px solid var(--line);border-radius:13px;padding:18px;}
.jc .n{font-size:11px;font-weight:800;color:var(--gold);letter-spacing:.12em;}
.jc b{display:block;font-size:14.5px;margin-top:6px;}
.jc p{font-size:12.5px;color:var(--mute);margin-top:5px;}
/* footer */
footer{background:#241F1A;color:#CFC6B8;padding:40px 0 48px;margin-top:0;}
footer .wrap{font-size:12px;line-height:1.85;}
footer b{color:#fff;font-size:13px;display:block;margin-bottom:8px;letter-spacing:.14em;}
footer .legal{margin-top:16px;padding-top:16px;border-top:1px solid #3A332B;font-size:11px;color:#9C9286;}
footer .ftlinks{margin-top:14px;}
footer .ftlinks a{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;color:#E3D3AC;text-decoration:none;border:1px solid #4A4138;border-radius:8px;padding:7px 14px;}
footer .ftlinks a:hover{border-color:#B08D3F;color:#fff;}
.totop{position:fixed;right:16px;bottom:16px;width:42px;height:42px;border-radius:50%;background:#fff;border:1px solid var(--line);color:var(--gold-d);font-size:17px;cursor:pointer;opacity:0;pointer-events:none;transition:.2s;box-shadow:0 6px 18px rgba(0,0,0,.1);z-index:60;}
.totop.on{opacity:1;pointer-events:auto;}
/* visual refresh — 텍스트 축소 · 이미지 확대 */
.hgrid{display:grid;grid-template-columns:1.05fr .95fr;gap:36px;align-items:center;}
.hphotos{display:grid;grid-template-columns:1.15fr 1fr;grid-template-rows:1fr 1fr;gap:10px;height:430px;}
.hphotos img{width:100%;height:100%;object-fit:cover;border-radius:16px;display:block;background:#EFE6D3;box-shadow:0 12px 30px rgba(60,40,10,.14);}
.hphotos img:first-child{grid-row:1/3;}
#a-sub,#c-sub,#j-sub,#cl-sub,#g-sub{display:none;}
.stp{padding:0;overflow:hidden;}
.stp .stimg{width:100%;aspect-ratio:16/10;object-fit:cover;display:block;}
.stp .stb{padding:16px 18px 18px;}
#a-pillars{grid-template-columns:repeat(3,minmax(0,1fr));}
#a-pillars .box{padding:15px 18px;text-align:center;}
#a-pillars .box p{display:none;}
#a-pillars .box h3{margin-top:0;font-size:15px;color:var(--gold-d);}
.band{width:100%;height:230px;object-fit:cover;border-radius:16px;display:block;margin-top:22px;}
#c-list1 li:nth-child(n+5),#c-list2 li:nth-child(n+5){display:none;}
.sbanner{height:130px;border-radius:14px;background-size:cover;background-position:center;position:relative;overflow:hidden;margin-top:8px;}
.sbanner:before{content:'';position:absolute;inset:0;background:linear-gradient(90deg,rgba(30,22,10,.62),rgba(30,22,10,.08));}
.sbanner h3.sname{position:absolute;left:20px;bottom:14px;margin:0;padding:0;border:none;color:#fff;font-size:15px;letter-spacing:.3em;}
.series p.sdesc{display:none;}
.pc .price{display:none;}
.cc .ph{aspect-ratio:4/3;}
.cc ul li:nth-child(n+2){display:none;}
.gtoggle{margin-top:18px;border:1px solid var(--gold-l);background:#fff;color:var(--gold-d);font-weight:800;font-size:13px;border-radius:99px;padding:9px 20px;cursor:pointer;font-family:inherit;}
#g-list{display:none;}
#g-list.open{display:grid;}
.jr{grid-template-columns:repeat(6,minmax(0,1fr));gap:10px;}
.jc{text-align:center;padding:16px 8px;position:relative;}
.jc p{display:none;}
.jc .n{width:38px;height:38px;border-radius:50%;background:linear-gradient(135deg,#C6A253,#8A6B26);color:#fff;font-size:14px;letter-spacing:0;display:flex;align-items:center;justify-content:center;margin:0 auto;}
.jc b{font-size:13.5px;margin-top:10px;}
/* mito section */
.mflow{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-top:26px;position:relative;}
.mstep{background:#fff;border:1px solid var(--line);border-radius:16px;padding:20px 14px 16px;text-align:center;position:relative;}
.mstep:not(:last-child):after{content:'';position:absolute;right:-10px;top:50%;width:8px;height:8px;border-top:2px solid var(--gold);border-right:2px solid var(--gold);transform:translateY(-50%) rotate(45deg);}
.mstep svg{width:64px;height:64px;display:block;margin:0 auto 10px;}
.mstep .mn{font-size:10.5px;font-weight:800;letter-spacing:.16em;color:var(--gold);}
.mstep b{display:block;font-size:14.5px;margin-top:4px;}
.mstep p{font-size:12px;color:var(--mute);margin-top:4px;line-height:1.5;}
.mtime{display:flex;justify-content:center;margin-top:16px;}
.mtime span{background:linear-gradient(135deg,#C6A253,#8A6B26);color:#fff;font-weight:800;font-size:13px;border-radius:99px;padding:8px 20px;}
.mcards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-top:22px;}
.mcard{background:#FBF3E2;border:1px solid var(--gold-l);border-radius:14px;padding:16px;text-align:center;}
.mcard b{font-size:14px;color:var(--gold-d);}
.mcard p{font-size:12px;color:#6b5b3c;margin-top:5px;line-height:1.5;}
@media(max-width:900px){.mflow{grid-template-columns:1fr 1fr;}.mstep:not(:last-child):after{display:none;}}
@media(max-width:620px){.mcards{grid-template-columns:1fr;}}
@media(max-width:900px){.g3,.pcards,.ccards{grid-template-columns:1fr 1fr;}.jr{grid-template-columns:repeat(3,minmax(0,1fr));}.stats{grid-template-columns:1fr 1fr;}.hgrid{grid-template-columns:1fr;gap:24px;}.hphotos{height:300px;}}
@media(max-width:620px){.g3,.g2,.pcards,.gloss,.row2,.ccards{grid-template-columns:1fr;}#a-pillars{grid-template-columns:1fr;}.jr{grid-template-columns:repeat(2,minmax(0,1fr));}.sec{padding:44px 0;}.hero{padding:40px 0 38px;}.hphotos{height:240px;}.band{height:150px;}}
</style>
</head>
<body>

<header class="top">
  <div class="wrap">
    <a class="brand" href="/stem/" onclick="event.preventDefault();window.scrollTo({top:0,behavior:'smooth'});"><img src="/fk-logo-r.png" alt="Follow Korea"><span>SEOUL · GANGNAM</span></a>
    <div class="right">
      <span class="adbadge" id="adbadge">Advertisement</span>
      <div class="langs" id="langs"></div>
    </div>
  </div>
</header>

<section class="hero">
  <div class="wrap">
    <div class="hgrid">
      <div>
        <div class="eyebrow" id="h-eyebrow"></div>
        <h1 id="h-title"></h1>
        <p class="lead" id="h-lead"></p>
        <div class="hbadges" id="h-badges"></div>
        <button class="cta" id="h-cta" onclick="document.getElementById('quote').scrollIntoView({behavior:'smooth'})"></button>
      </div>
      <div class="hphotos">
        <img src="/stem/img/hero-a.jpg" alt="" decoding="async">
        <img src="/stem/img/hero-b.jpg" alt="" decoding="async">
        <img src="/stem/img/hero-c.jpg" alt="" decoding="async">
      </div>
    </div>
    <div class="stats" id="h-stats"></div>
  </div>
</section>

<section class="sec">
  <div class="wrap">
    <div class="eyebrow" id="a-eyebrow"></div>
    <h2 id="a-title"></h2>
    <p class="sub" id="a-sub"></p>
    <div class="g3" id="a-steps"></div>
    <div class="g3" id="a-pillars"></div>
  </div>
</section>

<section class="sec alt">
  <div class="wrap">
    <div class="eyebrow" id="c-eyebrow"></div>
    <h2 id="c-title"></h2>
    <p class="sub" id="c-sub"></p>
    <img class="band" src="/stem/img/band-care.jpg" alt="" loading="lazy" decoding="async">
    <div class="g2">
      <div class="box"><h3 id="c-l1"></h3><ul class="lst" id="c-list1"></ul></div>
      <div class="box"><h3 id="c-l2"></h3><ul class="lst" id="c-list2"></ul></div>
    </div>
  </div>
</section>

<section class="sec" id="programs">
  <div class="wrap">
    <div class="eyebrow" id="p-eyebrow"></div>
    <h2 id="p-title"></h2>
    <p class="sub" id="p-sub"></p>
    <div id="p-series"></div>
    <div style="margin-top:34px">
      <h3 id="p-opttitle" style="font-size:14px;letter-spacing:.18em;color:var(--gold-d)"></h3>
      <div class="optwrap" id="p-options"></div>
      <p class="note" id="p-optnote"></p>
    </div>
  </div>
</section>

<section class="sec alt" id="mito">
  <div class="wrap">
    <div class="eyebrow" id="m-eyebrow"></div>

   언어 전환은 ?lang= 또는 사용자가 직접 누른 선택(localStorage)만 따른다. */
function detectLang(){
  var q=new URLSearchParams(location.search).get('lang');
  if(q&&T[q]) return q;
  try{ var s=localStorage.getItem('fk_stem_lang'); if(s&&T[s]) return s; }catch(e){}
  return 'en';
}
function setLang(l){
  LANG=T[l]?l:'en';
  try{ localStorage.setItem('fk_stem_lang',LANG); }catch(e){}
  document.documentElement.lang=LANG;
  render();
}

    return '<div class="series"><div class="sbanner" style="background-image:url(/stem/img/ser-'+(s.id==='FEMME'?'femme':s.id==='HOMME'?'homme':'pure')+'.jpg)"><h3 class="sname">'+esc(s.id)+'</h3></div><p class="sdesc">'+esc(t.sDesc[s.id])+'</p><div class="pcards">'+
      s.packs.map(function(p){
        var d=t.packs[p.id];
        return '<div class="pc'+(p.feat?' feat':'')+'">'+
          '<div class="tier">'+esc(t.tiers[p.tier])+'</div>'+
          '<div class="pname">'+esc(p.id)+'</div>'+
          '<ul>'+d.items.map(function(i){return '<li>'+esc(i)+'</li>';}).join('')+'</ul>'+
          '<div class="meta"><div>'+esc(d.stay)+'</div><div>'+esc(d.visit)+'</div></div>'+
          '<div class="price">'+esc(t.pQuote)+'</div>'+
          '<button class="cta sm ghost pbtn" onclick="pickAndJump(\''+p.id.replace(/'/g,"\\'")+'\')">'+esc(t.pBtn)+'</button>'+
        '</div>';
      }).join('')+'</div></div>';
  }).join('');
  el('p-opttitle').textContent=t.pOptTitle;
  el('p-options').innerHTML=t.pOptions.map(function(o){return '<span>'+esc(o)+'</span>';}).join('');
  el('p-optnote').textContent=t.pOptNote;

  el('cl-eyebrow').textContent=t.clEyebrow; el('cl-title').textContent=t.clTitle;
  el('cl-sub').textContent=t.clSub; el('cl-note').textContent=t.clNote;
  el('cl-list').innerHTML=CLINICS.map(function(c){
    var nm=CNAMES[c.id], d=t.clinics[c.id];
    var label=(LANG==='ko'?nm.ko:LANG==='zh'?nm.zh:nm.en);
    return '<div class="cc">'+
      '<img class="ph" src="'+CLINIC_IMG+c.thumb+'" alt="'+esc(label)+'" loading="lazy" decoding="async">'+
      '<div class="bd"><div class="cn">'+esc(label)+'</div>'+
      '<div class="cd">'+esc(d.d)+'</div>'+
      '<div class="cl">'+esc(t.areas[c.area])+'</div>'+
      '<ul>'+d.f.map(function(x){return '<li>'+esc(x)+'</li>';}).join('')+'</ul>'+
      '</div></div>';
  }).join('');
  el('g-eyebrow').textContent=t.gEyebrow; el('g-title').textContent=t.gTitle; el('g-sub').textContent=t.gSub;
  el('g-toggle').textContent=({en:'Show glossary',ko:'용어 설명 보기',zh:'查看术语说明',ja:'用語の説明を見る',ru:'Показать термины'})[LANG]||'Glossary';
  el('g-list').innerHTML=t.gloss.map(function(g){return '<div class="gi"><b>'+esc(g[0])+'</b><p>'+esc(g[1])+'</p></div>';}).join('');

  el('q-eyebrow').textContent=t.qEyebrow; el('q-title').textContent=t.qTitle; el('q-sub').textContent=t.qSub;
  el('s1t').textContent=t.s1t; el('s1s').textContent=t.s1s;
  el('s2t').textContent=t.s2t; el('s2s').textContent=t.s2s;
  el('s3t').textContent=t.s3t; el('s3s').textContent=t.s3s; el('s3note').textContent=t.s3note;
  el('s4t').textContent=t.s4t; el('s4s').textContent=t.s4s; el('s4note').textContent=t.s4note;
  el('l-sex').textContent=t.lSex; el('l-age').textContent=t.lAge; el('l-visits').textContent=t.lVisits;
  el('l-name').textContent=t.lName; el('l-phone').textContent=t.lPhone; el('l-msgr').textContent=t.lMsgr;
  el('l-msgid').textContent=t.lMsgId; el('l-email').textContent=t.lEmail; el('l-memo').textContent=t.lMemo;
  el('s1next').textContent=t.next;
  el('s2prev').textContent=t.prev; el('s2next').textContent=t.next;
  el('s3prev').textContent=t.prev; el('s3next').textContent=t.next;
  el('s4prev').textContent=t.prev; el('submitBtn').textContent=t.submit;

  /* step 1 — 프로그램 + 옵션(관심 항목) */
  var packChips=[];
  SERIES.forEach(function(s){ s.packs.forEach(function(p){
    packChips.push('<button type="button" class="chip'+(PICKS.indexOf(p.id)>=0?' on':'')+'" onclick="togglePick(\''+p.id.replace(/'/g,"\\'")+'\')">'+esc(p.id)+'<small>'+esc(s.id)+' · '+esc(t.tiers[p.tier])+'</small></button>');
  });});
  packChips.push('<button type="button" class="chip'+(PICKS.indexOf('Undecided')>=0?' on':'')+'" onclick="togglePick(\'Undecided\')">'+esc(t.visits[2])+'</button>');
  el('s1chips').innerHTML=packChips.join('');

  el('s2sex').innerHTML=t.sexes.map(function(x,i){return '<button type="button" class="chip'+(SEX===String(i)?' on':'')+'" onclick="setSex('+i+')">'+esc(x)+'</button>';}).join('');
  el('s2age').innerHTML=t.ages.map(function(x,i){return '<button type="button" class="chip'+(AGE===String(i)?' on':'')+'" onclick="setAge('+i+')">'+esc(x)+'</button>';}).join('');
  el('s2visits').innerHTML=t.visits.map(function(x,i){return '<button type="button" class="chip'+(VISITS===String(i)?' on':'')+'" onclick="setVisits('+i+')">'+esc(x)+'</button>';}).join('');
  el('s3elig').innerHTML=t.eligs.map(function(e){return '<button type="button" class="chip'+(ELIG===e[0]?' on':'')+'" onclick="setElig(\''+e[0]+'\')">'+esc(e[1])+'<small>'+esc(e[2])+'</small></button>';}).join('');

  el('f-eyebrow').textContent=t.fEyebrow; el('f-title').textContent=t.fTitle;
  el('f-list').innerHTML=t.faq.map(function(q,i){
    return '<div class="fq" id="fq'+i+'"><button onclick="toggleFq('+i+')">'+esc(q[0])+'</button><p>'+esc(q[1])+'</p></div>';
  }).join('');

  el('j-eyebrow').textContent=t.jEyebrow; el('j-title').textContent=t.jTitle; el('j-sub').textContent=t.jSub;
  el('j-list').innerHTML=t.journey.map(function(j){return '<div class="jc"><div class="n">'+esc(j[0])+'</div><b>'+esc(j[1])+'</b><p>'+esc(j[2])+'</p></div>';}).join('');

  el('ft-info').innerHTML=t.ftInfo;
  el('ft-home').textContent=t.ftHome;
  el('ft-legal').textContent=t.ftLegal;
  el('werr').textContent=''; el('werr3').textContent='';
}

function togglePick(id){ var i=PICKS.indexOf(id); if(i>=0) PICKS.splice(i,1); else PICKS.push(id); render(); }
function setSex(i){ SEX=String(i); render(); }
function setAge(i){ AGE=String(i); render(); }
function setVisits(i){ VISITS=String(i); render(); }
function setElig(v){ ELIG=v; render(); }
function pickAndJump(id){ if(PICKS.indexOf(id)<0) PICKS.push(id); render(); goStep(1); el('quote').scrollIntoView({behavior:'smooth'}); }
function toggleFq(i){ el('fq'+i).classList.toggle('open'); }

function goStep(n){
  var t=T[LANG];
  if(n===2&&!PICKS.length){ el('s1chips').scrollIntoView({behavior:'smooth',block:'center'}); return; }
  if(n===4&&!ELIG){ el('werr3').textContent=t.eligNeed; return; }
  for(var i=1;i<=5;i++){ var s=el('step'+i); if(s) s.style.display=(i===n?'':'none'); }
  var bars=el('wsteps').children;
  for(var k=0;k<bars.length;k++){ bars[k].className=(k<Math.min(n,4)?'on':''); }
  if(n>1) el('quote').scrollIntoView({behavior:'smooth',block:'start'});
}

function submitLead(){
  var t=T[LANG];
  var name=el('f-name').value.trim(), phone=el('f-phone').value.trim();
  var err=el('werr'); err.textContent='';
  if(!PICKS.length){ err.textContent=t.errPick; return; }
  if(!name||!phone){ err.textContent=t.errNeed; return; }
  if(!ELIG){ err.textContent=t.eligNeed; return; }
  var btn=el('submitBtn'); btn.disabled=true; btn.textContent=t.submitting;
  fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({
      channel:'stem',
      picks:PICKS.map(function(p){return {kw:p};}),
      traits:TRAITS,
      sex: SEX!==''?T.ko.sexes[Number(SEX)]:'',
      age: AGE!==''?T.ko.ages[Number(AGE)]:'',
      visits: VISITS!==''?T.ko.visits[Number(VISITS)]:'',
      name:name, phone:phone,
      email:el('f-email').value.trim(),
      messenger:el('f-msgr').value, messenger_id:el('f-msgid').value.trim(),
      memo:el('f-memo').value.trim(), lang:LANG, elig:ELIG
    })
  }).then(function(r){return r.json();}).then(function(d){
    btn.disabled=false; btn.textContent=t.submit;
    if(d&&d.ok){
      if(d.info_only){ el('r-title').textContent=t.rTitleInfo; el('r-sub').textContent=t.rSubInfo; }
      else{ el('r-title').textContent=t.rTitle; el('r-sub').textContent=t.rSub; }
      goStep(5);
    }else{ err.textContent=t.errRetry; }
  }).catch(function(){
    btn.disabled=false; btn.textContent=t.submit;
    err.textContent=t.errNet;
  });
}

setLang(detectLang());
window.addEventListener('scroll',function(){var b=el('totop');if(b)b.classList.toggle('on',window.scrollY>500);},{passive:true});
</script>
