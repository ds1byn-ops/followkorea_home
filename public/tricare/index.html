<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Follow Korea — Medical Care Coordination for USFK Families</title>
<meta name="description" content="English-speaking medical coordination for U.S. military families in Korea. Vision, dental, dermatology, health screening. Licensed Korean medical travel facilitator. Not affiliated with TRICARE or the U.S. Department of Defense.">
<meta name="robots" content="index,follow">
<meta property="og:title" content="Follow Korea — Medical Care Coordination for USFK Families">
<meta property="og:description" content="Written English quotes, appointment booking, interpreter escort, and transport from Pyeongtaek. Licensed by the Korean Ministry of Health and Welfare.">
<meta property="og:type" content="website">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
:root{
  --ink:#16202b; --ink2:#3b4a5c; --mute:#6c7c8e; --line:#dde4ec;
  --bg:#f6f8fa; --card:#ffffff;
  --navy:#1b3a5c; --navy-d:#12283f; --accent:#b4623a; --accent-s:#fbf1ec;
  --ok:#2f6b4f; --ok-s:#eef6f1; --no:#9a3b3b; --no-s:#faf0ef;
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
body{font-family:Barlow,'Helvetica Neue',Arial,sans-serif;background:var(--bg);color:var(--ink);line-height:1.6;-webkit-font-smoothing:antialiased}
html[lang="ko"] body{font-family:Pretendard,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;word-break:keep-all}
html[lang="ko"] .eyebrow,html[lang="ko"] .hfacts dt,html[lang="ko"] .grp h3,html[lang="ko"] footer h4{letter-spacing:.02em}
.wrap{max-width:1080px;margin:0 auto;padding-left:18px;padding-right:18px}
h1,h2,h3{letter-spacing:-.01em;text-wrap:balance}
h2{font-size:clamp(23px,3.4vw,31px);font-weight:700;line-height:1.2}
h3{font-size:18px;font-weight:700}
.eyebrow{font-family:'Barlow Condensed',Barlow,sans-serif;font-weight:700;letter-spacing:.14em;text-transform:uppercase;font-size:13px;color:var(--accent)}
.sub{color:var(--mute);margin-top:9px;font-size:15.5px}
.sec{padding-top:60px;padding-bottom:60px}
.sec.alt{background:var(--card);border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
a{color:var(--navy)}

.top{background:rgba(255,255,255,.95);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:50}
.top .wrap{display:flex;align-items:center;justify-content:space-between;height:60px;gap:12px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink)}
.brand img{height:30px;width:auto;display:block}
@media(max-width:420px){.brand img{height:26px}}
.brand b{font-family:'Barlow Condensed',Barlow,sans-serif;font-size:19px;letter-spacing:.06em;text-transform:uppercase}
.nav{display:flex;gap:2px}
.nav a{padding:7px 11px;border-radius:7px;font-size:14px;font-weight:600;color:var(--ink2);text-decoration:none}
.nav a:hover{background:var(--bg);color:var(--navy)}
.right{display:flex;align-items:center;gap:10px}
.langs{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.langs button{border:0;background:#fff;padding:7px 11px;font-size:12.5px;font-weight:700;color:var(--ink2);cursor:pointer;font-family:inherit}
.langs button.on{background:var(--navy);color:#fff}
.cta{background:var(--navy);color:#fff;font-weight:700;font-size:14px;padding:10px 17px;border-radius:8px;text-decoration:none;white-space:nowrap;display:inline-block}
.cta:hover{background:var(--navy-d)}
.cta.ghost{background:transparent;color:var(--navy);border:1.5px solid var(--navy)}
.cta.ghost:hover{background:#eef2f7}
.kko{display:inline-flex;align-items:center;gap:7px;background:#FEE500;color:#191919;font-weight:700;font-size:14px;padding:10px 16px;border-radius:8px;text-decoration:none;white-space:nowrap}
.kko:hover{background:#f5dc00}
.kko:focus-visible{outline:3px solid var(--navy);outline-offset:2px}
@media(max-width:1100px){.nav{display:none}}
@media(max-width:620px){.top .cta{display:none}}
@media(max-width:420px){.top .kko span{display:none}.top .kko{padding:10px 12px}}

.hero{background:linear-gradient(170deg,#fff 0%,#eef2f7 100%);border-bottom:1px solid var(--line)}
.hero .wrap{padding-top:54px;padding-bottom:50px}
.hgrid{display:grid;grid-template-columns:1.25fr .75fr;gap:44px;align-items:start}
@media(max-width:860px){.hgrid{grid-template-columns:1fr;gap:30px}}
.hero h1{font-size:clamp(31px,5.4vw,50px);font-weight:700;line-height:1.08;margin:14px 0 16px}
.hero p.lede{font-size:17px;color:var(--ink2);max-width:52ch}
.hbtns{display:flex;gap:10px;flex-wrap:wrap;margin-top:26px}
.hfacts{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:20px 22px}
.hfacts dl{display:grid;gap:14px}
.hfacts dt{font-family:'Barlow Condensed',Barlow,sans-serif;font-size:12.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--mute)}
.hfacts dd{font-size:15px;font-weight:600;margin-top:1px}
.hfacts dd small{display:block;font-weight:400;color:var(--mute);font-size:13px;letter-spacing:0}

.notice{background:#fff8f4;border:1px solid #f0d9cd;border-left:4px solid var(--accent);border-radius:8px;padding:15px 18px;font-size:14.5px;color:var(--ink2)}
.notice b{color:var(--ink)}

.cov{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:26px}
@media(max-width:760px){.cov{grid-template-columns:1fr}}
.covcard{border-radius:12px;padding:22px;border:1px solid var(--line);background:var(--card)}
.covcard.yes{background:var(--ok-s);border-color:#cfe3d7}
.covcard.no{background:var(--no-s);border-color:#eed5d3}
.covcard h3{display:flex;align-items:center;gap:9px;font-size:16.5px;flex-wrap:wrap}
.pill{font-family:'Barlow Condensed',Barlow,sans-serif;font-size:12px;letter-spacing:.1em;text-transform:uppercase;padding:3px 9px;border-radius:99px;font-weight:700}
.covcard.yes .pill{background:var(--ok);color:#fff}
.covcard.no .pill{background:var(--no);color:#fff}
.covcard ul{list-style:none;margin-top:14px;display:grid;gap:8px}
.covcard li{font-size:14.5px;padding-left:20px;position:relative;color:var(--ink2)}
.covcard li::before{content:"";position:absolute;left:4px;top:9px;width:6px;height:6px;border-radius:50%;background:currentColor;opacity:.45}
.covcard p.note{margin-top:15px;font-size:13.5px;color:var(--mute);border-top:1px dashed rgba(0,0,0,.12);padding-top:13px}

.steps4{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-top:28px;counter-reset:s}
@media(max-width:860px){.steps4{grid-template-columns:repeat(2,1fr)}}
@media(max-width:520px){.steps4{grid-template-columns:1fr}}
.step{background:var(--card);border:1px solid var(--line);border-radius:11px;padding:20px}
.step::before{counter-increment:s;content:counter(s,decimal-leading-zero);font-family:'Barlow Condensed',Barlow,sans-serif;font-size:26px;font-weight:700;color:var(--accent);display:block;line-height:1;margin-bottom:10px}
.step h3{font-size:15.5px;margin-bottom:5px}
.step p{font-size:14px;color:var(--mute)}

/* ---------- wizard ---------- */
.wiz{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:26px;margin-top:26px}
@media(max-width:520px){.wiz{padding:18px}}
.wsteps{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:22px}
.wstep{display:flex;align-items:center;gap:7px;font-size:13px;font-weight:600;color:var(--mute);border:1px solid var(--line);background:#fbfcfe;border-radius:99px;padding:6px 13px}
.wstep i{font-style:normal;width:19px;height:19px;border-radius:50%;background:var(--line);color:#7b8a9a;display:grid;place-items:center;font-size:11.5px;font-weight:700;flex:none}
.wstep.on{border-color:var(--navy);background:#eef2f7;color:var(--navy)}
.wstep.on i{background:var(--navy);color:#fff}
.wstep.done{border-color:#cfe3d7;background:var(--ok-s);color:var(--ok)}
.wstep.done i{background:var(--ok);color:#fff}
.panel{display:none}
.panel.on{display:block}
.wbtns{display:flex;align-items:center;gap:10px;margin-top:22px}
.wbtns .spacer{flex:1}
.wbtn{border:1.5px solid var(--line);background:#fff;color:var(--ink2);border-radius:9px;padding:12px 20px;font-size:15px;font-weight:700;cursor:pointer;font-family:inherit}
.wbtn:hover{border-color:#b9c6d4}
.wbtn.pri{background:var(--navy);border-color:var(--navy);color:#fff}
.wbtn.pri:hover{background:var(--navy-d)}
.wbtn:disabled{opacity:.45;cursor:not-allowed}
.wbtn:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.hint{font-size:13.5px;color:var(--mute);margin-top:12px}

.grp{margin-top:18px}
.grp:first-child{margin-top:0}
.grp h3{font-family:'Barlow Condensed',Barlow,sans-serif;letter-spacing:.1em;text-transform:uppercase;font-size:13px;color:var(--mute);margin-bottom:9px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1.5px solid var(--line);background:var(--card);border-radius:99px;padding:8px 15px;font-size:14px;font-weight:600;color:var(--ink2);cursor:pointer;user-select:none;font-family:inherit}
.chip:hover{border-color:#b9c6d4}
.chip.on{border-color:var(--navy);background:var(--navy);color:#fff}
.chip:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.selbar{margin-top:16px;padding:12px 14px;background:#f4f7fa;border-radius:10px;font-size:13.5px;color:var(--ink2);display:none}
.selbar.on{display:block}
.selbar b{color:var(--navy)}

.qres{display:grid;gap:10px}
.qcard{border:1.5px solid var(--line);border-radius:11px;padding:15px 17px;cursor:pointer;background:#fff}
.qcard.on{border-color:var(--navy);box-shadow:0 0 0 3px rgba(27,58,92,.09)}
.qcard .row{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.anm{font-weight:700;font-size:16px}
.anm .tag{font-family:'Barlow Condensed',Barlow,sans-serif;font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--mute);margin-left:8px;font-weight:700}
.qsum{font-weight:700;font-size:17px;font-variant-numeric:tabular-nums;text-align:right}
.qsum small{font-weight:400;color:var(--mute);font-size:12.5px;display:block}
.qlines{margin-top:9px;font-size:13.5px;color:var(--mute);display:grid;gap:3px}
.qlines > span{display:flex;justify-content:space-between;gap:12px;font-variant-numeric:tabular-nums}
.qlines .qmiss{display:block;margin-top:6px;padding-top:6px;border-top:1px dashed var(--line);color:var(--no);font-size:13px}
.qint{margin-top:11px;padding-top:10px;border-top:1px solid var(--line);font-size:13.5px;color:var(--mute);display:grid;gap:4px}
.qint .ir{display:flex;justify-content:space-between;gap:12px;font-variant-numeric:tabular-nums}
.qint .ir.tot{color:var(--ink);font-weight:700;font-size:15px}
.qint .igap{color:var(--accent);font-size:12.5px}
.qint.free{color:var(--ok);font-weight:600}

.frow{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:620px){.frow{grid-template-columns:1fr}}
label.fl{display:block;font-size:13px;font-weight:600;color:var(--ink2);margin-bottom:5px}
label.fl .req{color:var(--accent)}
input,select,textarea{width:100%;border:1.5px solid var(--line);border-radius:9px;padding:11px 13px;font-size:15px;font-family:inherit;color:var(--ink);background:#fff}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--navy);box-shadow:0 0 0 3px rgba(27,58,92,.1)}
.fld{margin-bottom:14px}
.radios{display:grid;gap:8px}
.radios label{display:flex;align-items:flex-start;gap:10px;border:1.5px solid var(--line);background:#fbfcfe;border-radius:10px;padding:12px 14px;font-size:14px;font-weight:600;color:var(--ink2);cursor:pointer}
.radios label:has(input:checked){border-color:var(--navy);background:#eef2f7;color:var(--navy)}
.radios input{width:17px;height:17px;flex:none;margin-top:2px;padding:0;accent-color:var(--navy)}
.radios small{display:block;font-weight:400;color:var(--mute);margin-top:2px}
.msgrow{display:flex;gap:8px}
.msgrow select{flex:0 0 124px}
.msgrow input{flex:1;min-width:0}
.consent{display:flex;gap:9px;align-items:flex-start;font-size:13px;color:var(--mute);margin-top:4px}
.consent input{width:auto;margin-top:3px;flex:none}
.errmsg{margin-top:14px;padding:13px 15px;border-radius:9px;font-size:14.5px;background:var(--no-s);border:1px solid #eed5d3;color:#7d2f2f;display:none}
.errmsg.on{display:block}
.result{text-align:center;padding:14px 0}
.result .big{font-size:42px;line-height:1}
.result h3{margin-top:12px;font-size:21px}
.result .hn{margin-top:14px;font-size:22px;font-weight:700;color:var(--navy);background:#eef2f7;border-radius:10px;padding:14px 18px;display:inline-block}
.result p{margin-top:14px;color:var(--mute);font-size:14.5px}

.two{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:26px}
@media(max-width:760px){.two{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:22px}
.card h3{margin-bottom:9px}
.card p,.card li{font-size:14.5px;color:var(--ink2)}
.card ul{list-style:none;display:grid;gap:7px;margin-top:10px}
.card li{padding-left:18px;position:relative}
.card li::before{content:"—";position:absolute;left:0;color:var(--accent)}

details{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px 18px;margin-top:10px}
details[open]{border-color:#c4d0dc}
summary{cursor:pointer;font-weight:600;font-size:15.5px;list-style:none}
summary::-webkit-details-marker{display:none}
summary::after{content:"+";float:right;color:var(--accent);font-weight:700;font-size:19px;line-height:1}
details[open] summary::after{content:"\2212"}
details p{margin-top:11px;font-size:14.5px;color:var(--ink2)}
details p + p{margin-top:8px}

footer{background:var(--navy-d);color:#c3d0dd;padding-top:44px;padding-bottom:44px;font-size:13.5px}
footer h4{font-family:'Barlow Condensed',Barlow,sans-serif;letter-spacing:.12em;text-transform:uppercase;font-size:13px;color:#fff;margin-bottom:10px}
footer a{color:#e3ebf3}
.disc{border:1px solid rgba(255,255,255,.18);border-radius:10px;padding:16px 18px;margin-bottom:26px;line-height:1.65}
.disc b{color:#fff}
.fgrid{display:grid;grid-template-columns:1.3fr 1fr 1fr;gap:26px}
@media(max-width:760px){.fgrid{grid-template-columns:1fr;gap:20px}}
.fgrid ul{list-style:none;display:grid;gap:6px}
.dls{display:flex;flex-wrap:wrap;gap:8px}
.dl{display:inline-flex;align-items:center;gap:7px;border:1px solid rgba(255,255,255,.28);border-radius:8px;padding:8px 13px;font-size:13px;font-weight:600;color:#fff;text-decoration:none}
.dl:hover{background:rgba(255,255,255,.12)}
.dl:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.dlnote{margin-top:8px;font-size:12px;color:#93a6b8}
.fkko{margin-top:26px;padding:18px 20px;border:1px solid rgba(255,255,255,.18);border-radius:10px;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
.fkko p{font-size:14.5px;color:#e3ebf3;margin:0;max-width:58ch}
.legal{margin-top:26px;padding-top:18px;border-top:1px solid rgba(255,255,255,.16);font-size:12.5px;color:#93a6b8;line-height:1.7}

.trichips{display:flex;flex-wrap:wrap;gap:8px;margin:22px 0 20px}
.trichips .tchip{border:1px solid var(--line);background:#fff;color:var(--ink2);border-radius:99px;padding:8px 15px;font-size:13.5px;font-weight:600;cursor:pointer;font-family:inherit}
.trichips .tchip.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.trigrid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
@media(max-width:860px){.trigrid{grid-template-columns:1fr 1fr}}
@media(max-width:560px){.trigrid{grid-template-columns:1fr}}
.thcard{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--card);display:flex;flex-direction:column}
.thcard .th{height:150px;background:#eef2f7 center/cover no-repeat}
.thcard .tb{padding:14px 16px}
.thcard .tb h3{font-size:16px}
.thcard .tdept{color:var(--mute);font-size:13px;margin-top:3px}
.thcard .ttr{display:flex;flex-wrap:wrap;gap:5px;margin-top:10px}
.thcard .ttr span{font-size:11.5px;background:var(--bg);color:var(--ink2);border:1px solid var(--line);border-radius:6px;padding:2px 7px}
</style>
</head>
<body>

<header class="top">
  <div class="wrap">
    <a class="brand" href="/tricare/" aria-label="Follow Korea"><img src="/fk-logo-r.png" alt="Follow Korea" onerror="this.insertAdjacentHTML('afterend','&lt;b&gt;Follow Korea&lt;/b&gt;');this.style.display='none'"></a>
    <nav class="nav">
      <a href="#coverage" data-i="nav1"></a>
      <a href="#quote" data-i="nav2"></a>
      <a href="#how" data-i="nav3"></a>
      <a href="#logistics" data-i="nav4"></a>
      <a href="#faq" data-i="nav5"></a>
      <a href="#hospitals" data-i="nav6"></a>
    </nav>
    <div class="right">
      <div class="langs">
        <button type="button" id="lang-en" onclick="setLang('en')">EN</button>
        <button type="button" id="lang-ko" onclick="setLang('ko')">한국어</button>
      </div>
      <a class="cta" href="#quote" data-i="ctaTop"></a>
      <a class="kko" href="https://pf.kakao.com/_xfZxjiX/chat" target="_blank" rel="noopener">
        <svg viewBox="0 0 24 24" width="17" height="17" aria-hidden="true"><path fill="currentColor" d="M12 3C6.48 3 2 6.58 2 10.99c0 2.82 1.85 5.29 4.64 6.7-.2.75-.75 2.74-.86 3.16-.13.53.19.52.4.38.17-.11 2.66-1.8 3.74-2.53.68.1 1.38.15 2.08.15 5.52 0 10-3.58 10-7.86S17.52 3 12 3z"/></svg>
        <span data-i="kakao"></span>
      </a>
    </div>
  </div>
</header>

<section class="hero">
  <div class="wrap">
    <div class="hgrid">
      <div>
        <span class="eyebrow" data-i="heroEyebrow"></span>
        <h1 data-i="heroH1"></h1>
        <p class="lede" data-i="heroLede"></p>
        <div class="hbtns">
          <a class="cta" href="#quote" data-i="heroBtn1"></a>
          <a class="cta ghost" href="#coverage" data-i="heroBtn2"></a>
        </div>
      </div>
      <aside class="hfacts">
        <dl>
          <div><dt data-i="f1t"></dt><dd data-i="f1d"></dd></div>
          <div><dt data-i="f2t"></dt><dd data-i="f2d"></dd></div>
          <div><dt data-i="f3t"></dt><dd data-i="f3d"></dd></div>
          <div><dt data-i="f4t"></dt><dd data-i="f4d"></dd></div>
        </dl>
      </aside>
    </div>
  </div>
</section>

<section class="sec" id="coverage">
  <div class="wrap">
    <span class="eyebrow" data-i="covEyebrow"></span>
    <h2 data-i="covH2"></h2>
    <p class="sub" data-i="covSub"></p>
    <div class="cov">
      <div class="covcard no">
        <h3><span class="pill" data-i="covNoPill"></span> <span data-i="covNoTitle"></span></h3>
        <ul data-list="covNoList"></ul>
        <p class="note" data-i="covNoNote"></p>
      </div>
      <div class="covcard yes">
        <h3><span class="pill" data-i="covYesPill"></span> <span data-i="covYesTitle"></span></h3>
        <ul data-list="covYesList"></ul>
        <p class="note" data-i="covYesNote"></p>
      </div>
    </div>
    <div class="notice" style="margin-top:22px" data-i="covNotice"></div>
  </div>
</section>

<section class="sec alt" id="quote">
  <div class="wrap">
    <span class="eyebrow" data-i="wizEyebrow"></span>
    <h2 data-i="wizH2"></h2>
    <p class="sub" data-i="wizSub"></p>

    <div class="wiz">
      <div class="wsteps" id="wsteps"></div>

      <!-- STEP 1 -->
      <div class="panel on" id="p1">

 faq:[
  ['TRICARE나 미군과 제휴 관계인가요?','아닙니다. 팔로우코리아는 대한민국 보건복지부에 외국인환자 유치기관으로 등록된 민간 회사입니다. TRICARE, International SOS, 미국 국방부, 주한미군과 제휴·보증·후원 관계가 없습니다. TRICARE라는 명칭은 고객이 가입한 보험 제도를 지칭하는 용도로만 사용합니다.'],
  ['비용이 얼마나 드나요?','자비 부담 선택 진료는 고객 부담 수수료가 없습니다. 병원이 수수료를 지급하며, 안내받은 금액이 그대로 결제 금액입니다 — 병원 수가 위에 마진을 붙이지 않습니다. 시술 합계가 100만 원 미만이면 통역 동행비 4만 원(현장 2시간 포함)이 있으며, 결정 전에 견적서에 표시해 드립니다.|TRICARE 급여 진료는 정액 코디네이션 비용만 받고 어느 쪽에서도 수수료를 받지 않습니다. 선호가 아니라 법적인 선입니다 — 다음 항목을 봐주세요.'],
  ['왜 TRICARE 급여 진료에는 수수료를 안 받나요?','TRICARE는 미국 연방 의료 프로그램이고, 연방 Anti-Kickback Statute는 해당 프로그램이 비용을 부담하는 환자를 소개한 대가로 금품을 주고받는 것을 금지합니다. 이를 무시한 구조는 유치업자뿐 아니라 병원과 환자까지 위험에 빠뜨립니다. 그래서 자비 진료는 수수료 기반, TRICARE가 걸린 건은 정액으로 엄격히 분리합니다.'],
  ['왜 이 페이지에 가격을 공개하지 않나요?','의료광고법상 병원을 특정한 가격을 일반에 공개하는 것이 제한됩니다. 대신 신청하시면 병원명과 항목별 금액이 들어간 서면 견적을 결정 전에 드립니다.'],
  ['병원에서 영어가 통하나요?','영어 가능 인력이 있는 병원도 있지만 없는 곳이 더 많고, 특정 시술을 가장 잘하는 병원이 영어도 가장 잘하는 것은 아닙니다. 그래서 주소만 알려드리지 않고 코디네이터가 동행합니다. 상담, 동의서, 수납까지 통역합니다.'],
  ['TRICARE 환급 청구용 서류를 받을 수 있나요?','네. 영문 진료비 내역서와 ICD-10 코드가 포함된 진단서를 병원에 요청해 드립니다. 청구서 양식에 필요한 서류입니다. 방문 전에 미리 요청하세요 — 사후에는 훨씬 어렵습니다.'],
  ['한국에 사는 예비역·퇴역군인입니다. 가능한가요?','자비 진료는 가능합니다. 복무 관련 질환이라면 VA 해외의료프로그램(VA Foreign Medical Program)에서 해외 진료비를 환급받을 수 있습니다. VA와의 절차는 본인이 진행하시고, 서류는 저희가 준비해 드립니다.'],
  ['안전한가요? 병원은 어떻게 고르나요?','모든 제휴처는 저희와 서면 계약을 맺은 정식 의료기관이며 직접 방문해 확인합니다. 저희는 리뷰 사이트가 아니고 중립인 척하지도 않습니다 — 병원에서 수수료를 받습니다. 그래서 그 사실을 먼저 밝히고, 가기 전에 항목별 금액을 보여드리고, 문의하지 않은 시술을 권하지 않습니다.']

function t(k){ return (T[LANG] && T[LANG][k]!==undefined) ? T[LANG][k] : (T.en[k]||''); }
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function krw(n){return '₩'+Number(n||0).toLocaleString('en-US');}

window.setLang=function(l){
  LANG=(l==='ko')?'ko':'en';
  try{localStorage.setItem('fk_tricare_lang',LANG);}catch(e){}
  document.documentElement.lang=LANG;
  document.getElementById('lang-en').classList.toggle('on',LANG==='en');
  document.getElementById('lang-ko').classList.toggle('on',LANG==='ko');
  applyLang();
};

function applyLang(){
  [].forEach.call(document.querySelectorAll('[data-i]'),function(el){ el.innerHTML=t(el.getAttribute('data-i')); });
  [].forEach.call(document.querySelectorAll('[data-list]'),function(ul){
    ul.innerHTML=(t(ul.getAttribute('data-list'))||[]).map(function(x){return '<li>'+x+'</li>';}).join('');
  });
  [].forEach.call(document.querySelectorAll('.chip'),function(c){ c.textContent=c.getAttribute('data-'+LANG)||c.getAttribute('data-en'); });
  document.getElementById('faqBox').innerHTML=(t('faq')||[]).map(function(f){
    return '<details><summary>'+esc(f[0])+'</summary>'+f[1].split('|').map(function(p){return '<p>'+p+'</p>';}).join('')+'</details>';
  }).join('');
  document.title = LANG==='ko'
    ? '팔로우코리아 — 주한미군 가족을 위한 의료 코디네이션'
    : 'Follow Korea — Medical Care Coordination for USFK Families';
  renderSteps(); renderSel(); renderQuotes();
}

function renderSteps(){
  var names=[t('ws1'),t('ws2'),t('ws3'),t('ws4')];
  document.getElementById('wsteps').innerHTML=names.map(function(n,i){
    var k=i+1, cls = STEP===k?'on' : (STEP>k?'done':'');
    return '<span class="wstep '+cls+'"><i>'+(STEP>k?'✓':k)+'</i>'+esc(n)+'</span>';
  }).join('');
}

window.goStep=function(n){
  if(n===2 && !KWS.length) return;
  STEP=n;
  var we=document.getElementById('werr'); if(we) we.classList.remove('on');
  [1,2,3,4,5].forEach(function(i){ var p=document.getElementById('p'+i); if(p) p.classList.toggle('on', i===n); });
  renderSteps();
  if(n===2) renderQuotes();
  var q=document.getElementById('quote');
  if(q) window.scrollTo({top:q.offsetTop-70,behavior:'smooth'});
};

window.resetWizard=function(){
  KWS=[]; PREFER='';
  [].forEach.call(document.querySelectorAll('.chip'),function(c){c.classList.remove('on');});
  ['f-name','f-phone','f-email','f-msgid','f-memo'].forEach(function(id){var e=document.getElementById(id); if(e) e.value='';});
  ['f-base','f-status','f-when'].forEach(function(id){var e=document.getElementById(id); if(e) e.selectedIndex=0;});
  var pv=document.getElementById('f-privacy'); if(pv) pv.checked=false;
  [].forEach.call(document.querySelectorAll('input[name=elig]'),function(r){r.checked=false;});
  document.getElementById('werr').classList.remove('on');
  document.getElementById('btn1next').disabled=true;
  renderSel(); goStep(1);
};

var chips=[].slice.call(document.querySelectorAll('.chip'));
chips.forEach(function(b){
  b.addEventListener('click',function(){
    b.classList.toggle('on');
    KWS=chips.filter(function(x){return x.classList.contains('on');})
             .map(function(x){return {v:x.getAttribute('data-kw'),el:x};});
    PREFER='';
    document.getElementById('btn1next').disabled = KWS.length===0;
    renderSel();
  });
});
function labelOf(k){ return k.el.getAttribute('data-'+LANG)||k.el.getAttribute('data-en'); }
function renderSel(){
  var bar=document.getElementById('selbar');
  if(!KWS.length){ bar.classList.remove('on'); bar.innerHTML=''; return; }
  bar.classList.add('on');
  bar.innerHTML=t('selSome').replace('{x}',esc(KWS.map(labelOf).join(', ')));
}

function quoteFor(h){
  var sum=0,hit=0,lines=[],missing=[];
  KWS.forEach(function(k){
    var kw=k.v.toLowerCase();
    var ms=(h.items||[]).filter(function(i){
      return ((i.ko||'')+' '+(i.zh||'')+' '+(i.cat||'')).toLowerCase().indexOf(kw)>-1;
    });
    if(ms.length){
      var min=Math.min.apply(null,ms.map(function(m){return m.krw;}));
      hit++; sum+=min; lines.push({label:labelOf(k),krw:min});
    } else { missing.push(labelOf(k)); }
  });
  return {anon:h.anon,vat:h.vat_note,sum:sum,hit:hit,lines:lines,missing:missing};
}

// 통역 동행비 — /b2c 및 엣지함수(b2c-pricelist)와 동일 규칙.
// 시술 합계 100만원 미만: 정액 4만원(현장 2시간 포함, 초과 시간당 2만원) / 100만원 이상: 무료.
var INTERP_FREE=1000000, INTERP_FEE=40000, INTERP_HOUR=20000;
function interpBlock(sum){
  if(sum>=INTERP_FREE){
    return '<div class="qint free">'+t('interpFree')+'</div>';
  }
  var gap=INTERP_FREE-sum;
  return '<div class="qint">'
    +'<span class="ir"><span>'+t('interpFee').replace('{h}',krw(INTERP_HOUR))+'</span><span>+'+krw(INTERP_FEE)+'</span></span>'
    +'<span class="ir tot"><span>'+t('interpTotal')+'</span><span>'+krw(sum+INTERP_FEE)+'</span></span>'
    +'<span class="igap">'+t('interpGap').replace('{x}',krw(gap))+'</span>'
    +'</div>';
}

function renderQuotes(){
  var box=document.getElementById('qres');
  if(!box) return;
  var hint=document.getElementById('s2hint');
  if(!KWS.length || !HOSPS.length){ box.innerHTML=''; if(hint) hint.textContent=''; return; }
  var qs=HOSPS.map(quoteFor).filter(function(q){return q.hit>0;});
  if(!qs.length){ box.innerHTML='<div class="notice">'+t('s2none')+'</div>'; if(hint) hint.textContent=''; return; }
  var maxHit=Math.max.apply(null,qs.map(function(q){return q.hit;}));
  qs=qs.filter(function(q){return q.hit===maxHit;}).sort(function(a,b){return a.sum-b.sum;}).slice(0,6);
  if(hint) hint.innerHTML=t('s2lead').replace('{n}',qs.length).replace('{s}',(LANG==='en'&&qs.length>1)?'s':'');
  box.innerHTML=qs.map(function(q){
    return '<div class="qcard'+(PREFER===q.anon?' on':'')+'" data-anon="'+esc(q.anon)+'" tabindex="0" role="button">'
      +'<div class="row"><span class="anm">Clinic '+esc(q.anon)
      +'<span class="tag">'+t('matched').replace('{h}',q.hit).replace('{t}',KWS.length)+'</span></span>'
      +'<span class="qsum">'+krw(q.sum)+'<small>'+t('from')+(q.vat?' · '+t('vat'):'')+'</small></span></div>'
      +'<div class="qlines">'+q.lines.map(function(l){
          return '<span><span>'+esc(l.label)+'</span><span>'+krw(l.krw)+'</span></span>';
        }).join('')
      +(q.missing.length?'<span class="qmiss">'+t('notOffered').replace('{x}',esc(q.missing.join(', ')))+'</span>':'')
      +'</div>'+interpBlock(q.sum)+'</div>';
  }).join('');
  [].slice.call(box.querySelectorAll('.qcard')).forEach(function(c){
    var pick=function(){ PREFER=c.getAttribute('data-anon'); renderQuotes(); };
    c.addEventListener('click',pick);
    c.addEventListener('keydown',function(e){ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); pick(); } });
  });
}

function showErr(k){
  var e=document.getElementById('werr');
  e.textContent=t(k); e.classList.add('on');
}

window.submitLead=function(){
  var err=document.getElementById('werr'); err.classList.remove('on');
  var eligEl=document.querySelector('input[name=elig]:checked');
  var name=document.getElementById('f-name').value.trim();
  var phone=document.getElementById('f-phone').value.trim();
  if(!eligEl) return showErr('errElig');
  if(!name||!phone) return showErr('errName');
  if(!document.getElementById('f-privacy').checked) return showErr('errConsent');
  if(!KWS.length && !document.getElementById('f-memo').value.trim()) return showErr('errPick');

  var btn=document.getElementById('btnSubmit');
  btn.disabled=true; btn.textContent=t('sending');

  var memo=[];
  var when=document.getElementById('f-when').value;
  if(when) memo.push('Timing: '+when);
  if(!KWS.length) memo.push('(no service selected)');
  var free=document.getElementById('f-memo').value.trim();
  if(free) memo.push(free);

  fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({
      channel:'usfk',
      picks:(KWS.length?KWS:[{v:'검진'}]).map(function(k){return {kw:k.v};}),
      traits:[], prefer_anon:PREFER,
      name:name, phone:phone,
      email:document.getElementById('f-email').value.trim(),
      base:document.getElementById('f-base').value,
      status:document.getElementById('f-status').value,
      messenger:document.getElementById('f-msgr').value,
      messenger_id:document.getElementById('f-msgid').value.trim(),
      memo:memo.join(' | '),
      lang:LANG, elig:eligEl.value
    })
  }).then(function(r){return r.json();}).then(function(d){
    btn.disabled=false; btn.textContent=t('submit');
    if(d && d.ok){
      var info=!!d.info_only;
      document.getElementById('rIcon').textContent = info?'ℹ':'✓';
      document.getElementById('rTitle').textContent = t(info?'rTitleInfo':'rTitle');
      var hn=document.getElementById('rHosp');
      if(info && d.hospital){ hn.textContent=d.hospital; hn.hidden=false; } else { hn.hidden=true; }
      document.getElementById('rSub').textContent = t(info?'rSubInfo':'rSub');
      STEP=5; goStep(5);
    } else { showErr('errNet'); }
  }).catch(function(){
    btn.disabled=false; btn.textContent=t('submit');
    showErr('errNet');
  });
};
