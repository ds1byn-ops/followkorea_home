:root{--brand:#D8354B;--brand-d:#A81F38;--ink:#2A1B20;--mute:#8a6b73;--line:#F3DEE2;--bg:#FBF4F5;--gold:#C9A24B;}
*{margin:0;padding:0;box-sizing:border-box;}
html{scroll-behavior:smooth;}
body{font-family:'Pretendard','Apple SD Gothic Neo','PingFang SC','Microsoft YaHei','Hiragino Sans','Malgun Gothic',sans-serif;background:var(--bg);color:var(--ink);line-height:1.6;word-break:keep-all;overflow-wrap:break-word;}

h2{font-size:clamp(20px,3.6vw,27px);font-weight:900;letter-spacing:-.5px;}
.sub{color:var(--mute);font-size:13.5px;margin-top:6px;}
.sec{padding:56px 0;}
.top{background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:40;}
.top .wrap{display:flex;align-items:center;justify-content:space-between;height:62px;gap:10px;}

.nav{display:flex;gap:2px;flex-wrap:wrap;}
.nav a{padding:7px 10px;border-radius:8px;font-size:13px;font-weight:700;color:#3d4a63;text-decoration:none;white-space:nowrap;}
.nav a:hover{background:var(--bg);color:var(--brand-d);}
.navcta{background:linear-gradient(135deg,#E8455F,#B02440);color:#fff;font-weight:800;font-size:13px;padding:9px 15px;border-radius:10px;text-decoration:none;white-space:nowrap;}

.adnote{font-size:10px;color:var(--mute);text-align:right;line-height:1.5;}
.hero{background:linear-gradient(180deg,#fff, #FBE9EC);padding:48px 0 40px;border-bottom:1px solid var(--line);}
.hero2{display:grid;grid-template-columns:1.15fr .85fr;gap:38px;align-items:center;}
.collage{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;}
.collage img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:14px;box-shadow:0 10px 26px rgba(120,35,50,.16);background:#e8edf6;}

.hright{position:relative;padding-bottom:14px;}
.chipfloat{position:absolute;left:-8px;bottom:-6px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:9px 15px;font-weight:800;font-size:12.5px;color:var(--brand-d);box-shadow:0 10px 24px rgba(120,35,50,.16);}
.badge{display:inline-flex;align-items:center;gap:7px;font-size:12px;font-weight:700;color:var(--brand-d);border:1px solid #F0C4CD;background:#fff;border-radius:99px;padding:6px 13px;margin-bottom:16px;}
.badge .dot{width:7px;height:7px;border-radius:50%;background:var(--brand);flex:none;}
.hero h1{font-size:clamp(24px,4.6vw,36px);font-weight:900;letter-spacing:-1px;line-height:1.38;}
.hero h1 b{color:var(--brand-d);}
.hero p.lead{margin-top:14px;font-size:clamp(13.5px,2.4vw,15.5px);color:var(--mute);max-width:640px;}
.cta{display:inline-block;margin-top:26px;background:linear-gradient(135deg,#E8455F,#A81F38);border:1px solid var(--gold);color:#fff;font-weight:800;font-size:15px;padding:14px 30px;border-radius:12px;text-decoration:none;box-shadow:0 8px 24px rgba(200,50,80,.30);}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;}
.st{background:#fff;border:1px solid var(--line);border-radius:13px;padding:16px;display:block;text-decoration:none;transition:.15s;}

.mq{overflow:hidden;max-width:1080px;margin:0 auto;padding:4px 18px 34px;-webkit-mask-image:linear-gradient(90deg,transparent,#000 7%,#000 93%,transparent);mask-image:linear-gradient(90deg,transparent,#000 7%,#000 93%,transparent);}

.mqtrack img{height:92px;border-radius:12px;display:block;}

.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-top:26px;}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:22px 20px;}

.hsec{background:#fff;border-top:1px solid var(--line);border-bottom:1px solid var(--line);}

.gtab{padding:8px 15px;border:1px solid var(--line);border-radius:10px;background:#fff;font-size:12.5px;font-weight:700;color:#3d4a63;cursor:pointer;user-select:none;}

.hgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:20px;}
.hosp{background:var(--bg);border:1px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column;}
.hosp .thumb{width:100%;aspect-ratio:16/9;object-fit:cover;display:block;background:#e8edf6;}
.hosp .thumb.ph{display:flex;align-items:center;justify-content:center;font-size:26px;font-weight:900;color:#dcb2ba;background:linear-gradient(135deg,#fbeef0,#f5dee3);}

.hosp h3{font-size:14.5px;font-weight:800;display:flex;align-items:center;gap:6px;flex-wrap:wrap;}
.hosp .meta{font-size:11.5px;color:var(--mute);margin-top:2px;}
.hosp .ov{font-size:12.3px;color:#3d4a63;margin-top:8px;line-height:1.65;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;}

.treats span{font-size:10.5px;background:#FDECEF;color:var(--brand-d);border-radius:6px;padding:2px 7px;font-weight:600;}
.hosp .docs{font-size:11px;color:var(--mute);margin-top:8px;}
.badge-ad{display:inline-block;font-size:10px;font-weight:700;color:#8a6d2b;background:#fdf6e3;border:1px solid #ecdcae;border-radius:5px;padding:1px 6px;vertical-align:2px;}
.hmore{display:block;margin:16px auto 0;padding:10px 26px;border:1px solid var(--line);border-radius:10px;background:#fff;font-size:13px;cursor:pointer;color:#3d4a63;}
.wiz{background:#fff;border:1px solid var(--line);border-radius:18px;padding:26px 24px;margin-top:22px;box-shadow:0 10px 34px rgba(120,35,50,.06);}
.steps{display:flex;gap:6px;margin-bottom:20px;flex-wrap:wrap;}
.stp{font-size:11.5px;font-weight:700;color:var(--mute);border:1px solid var(--line);border-radius:99px;padding:5px 12px;}
.stp.on{background:var(--brand);border-color:var(--brand);color:#fff;}
.panel{display:none;}
.panel.on{display:block;}
.searchbar{display:flex;gap:8px;}
.searchbar input{flex:1;padding:13px 16px;border:1.5px solid var(--line);border-radius:12px;font-size:15px;background:#fbfcfe;}

.searchbar button{padding:0 20px;border:none;border-radius:12px;background:var(--brand);color:#fff;font-weight:800;font-size:14px;cursor:pointer;}
.kws{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px;min-height:30px;}
.kw{display:inline-flex;align-items:center;gap:6px;background:#FDECEF;color:var(--brand-d);border-radius:99px;padding:6px 8px 6px 13px;font-size:13px;font-weight:700;}

.hint{font-size:11.5px;color:var(--mute);margin-top:10px;}
.wbtns{display:flex;gap:8px;margin-top:20px;justify-content:space-between;}

.wbtn.pri{background:var(--brand);border-color:var(--brand);color:#fff;}

.qcard{border:1.5px solid var(--line);border-radius:13px;padding:14px 16px;margin-bottom:9px;cursor:pointer;background:#fbfcfe;}
.qcard.on{border-color:var(--brand);background:#FDEEF1;}
.qcard .row{display:flex;justify-content:space-between;align-items:center;gap:10px;}
.qcard .anm{font-size:14.5px;font-weight:900;}
.qcard .anm .tag{font-size:10.5px;color:var(--mute);font-weight:600;margin-left:7px;}
.qcard .amt{font-size:16px;font-weight:900;color:var(--brand-d);white-space:nowrap;}
.qcard .amt .u{font-size:10.5px;color:var(--mute);font-weight:500;}
.qcard .det{font-size:11.8px;color:var(--mute);margin-top:7px;display:none;line-height:1.8;}
.qcard.on .det{display:block;}
.tsel{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px;}
.topt{border:1.5px solid var(--line);border-radius:11px;padding:11px 13px;font-size:12.8px;font-weight:700;color:#3d4a63;cursor:pointer;text-align:center;background:#fbfcfe;user-select:none;}
.topt.on{border-color:var(--brand);background:#FDEEF1;color:var(--brand-d);}
.fform label{display:block;font-size:13px;font-weight:800;color:#2a3550;margin:14px 0 6px;}
.fform input,.fform textarea{width:100%;padding:13px 14px;border:1px solid #d8deea;border-radius:10px;font-size:14.5px;font-family:inherit;background:#fbfcfe;}
#f-elig label{display:flex;align-items:flex-start;gap:9px;text-align:left;font-size:13px;font-weight:600;color:#3d4a63;cursor:pointer;border:1.5px solid var(--line);border-radius:10px;padding:11px 13px;background:#fbfcfe;margin:0;}

.result{text-align:center;padding:22px 8px;}
.result .big{font-size:44px;}
.result h3{font-size:20px;font-weight:900;margin:10px 0 4px;}
.result .hn{font-size:24px;font-weight:900;color:var(--brand-d);margin:8px 0;}
.result p{font-size:13.5px;color:var(--mute);}
.errmsg{color:#c0392b;font-size:12.5px;margin-top:10px;min-height:16px;text-align:center;}
.totop{position:fixed;bottom:22px;left:calc(50% + 540px + 14px);width:46px;height:46px;border-radius:50%;border:1px solid var(--line);background:#fff;color:var(--brand-d);font-size:19px;font-weight:900;cursor:pointer;box-shadow:0 8px 22px rgba(120,35,50,.18);display:none;align-items:center;justify-content:center;z-index:45;}
.totop.on{display:flex;}
@media(max-width:1220px){.totop{left:auto;right:16px;}}
.kakao-btn{display:inline-flex;align-items:center;gap:8px;margin:12px 0 4px;padding:10px 18px;border-radius:999px;background:#FEE500;color:#191919;font-size:13px;font-weight:700;line-height:1;text-decoration:none;}.kakao-btn:hover{background:#f5dc00;}
.legal{background:#fff;border-top:1px solid var(--line);padding:26px 0 40px;font-size:11.5px;color:var(--mute);line-height:2;}

@media(max-width:820px){.stats{grid-template-columns:1fr 1fr;}.cards{grid-template-columns:1fr 1fr;}.tsel{grid-template-columns:1fr 1fr;}.hero2{grid-template-columns:1fr;}.hright{display:none;}}

@media(max-width:560px){.cards{grid-template-columns:1fr;}.hgrid{grid-template-columns:1fr;}.tsel{grid-template-columns:1fr;}}
</style>
</head>

ure care series.","ovja":"リベリ医院江南店(RE:BERRY)は新論峴駅徒歩圏(瑞草区江南大路69ギル8、KIタワー地下1・2階)の皮膚・レーザー専門クリニックです。リュ・ユンゴン代表院長・オ・イェジン副院長が診療し、ウルセラプライム・サーマジーFLX・オンダ・ソフウェーブなどのリフティング機器とリジュラン・コラーゲン水光・糸リフト・幹細胞プログラム、SREシグネチャーケアを運営しています。","doctors":["류윤곤 대표원장","오예진 부원장"]},{"name":"타토아의원","zh":"TATOA皮肤科(新沙)","en":"TATOA Clinic (Sinsa)","dept":"피부과","deptzh":"皮肤科","depten":"Dermatology","deptja":"皮膚科","cat":"피부","treats":["문신·반영구 제거","레이저토닝·제모","보톡스·필러·실리프팅"],"trzh":["纹身·半永久去除","激光净肤·脱毛","肉毒·玻尿酸·线雕"],"tren":["Tattoo & PMU Removal","Laser Toning & Hair Removal","Botox·Filler·Thread Lift"],"trja":["タトゥー・アートメイク除去","レーザートーニング・脱毛","ボトックス・フィラー・糸リフト"],"loc":"서울 신사","loczh":"首尔新沙","locen":"Sinsa, Gangnam","locja":"ソウル新沙","overview":"타토아의원은 신사역 인근 ICT타워에 위치한 피부과로, 문신·반영구 제거와 레이저 피부관리에 특화되어 있으며 젠틀맥스프로·울쎄라·써마지·슈링크 등 장비를 보유하고 원주점·명동센터를 함께 운영합니다.","ovzh":"TATOA皮肤科位于新沙站旁ICT大厦，是专注纹身·半永久去除与激光皮肤管理的皮肤科医院，拥有GentleMax Pro、Ulthera、Thermage、Shurink等设备，并在原州和明洞设有分支。","oven":"TATOA Clinic, located in the ICT Tower near Sinsa Station, specializes in tattoo & permanent-makeup removal and laser skin care, equipped with GentleMax Pro, Ulthera, Thermage and Shurink, with branches in Wonju and Myeongdong.","ovja":"TATOA医院は新沙駅近くのICTタワーに位置する皮膚科で、タトゥー・アートメイク除去とレーザー肌管理に特化し、ジェントルマックスプロ・ウルセラ・サーマジー・シュリンクなどの機器を備え、原州店・明洞センターも運営しています。","doctors":[]},{"name":"포브의원","zh":"PO:VE皮肤科","en":"PO:VE Clinic","dept":"피부과","deptzh":"皮肤科","depten":"Dermatology","deptja":"皮膚科","cat":"피부","treats":["울쎄라·소프웨이브·써마지","스킨부스터·콜라겐부스터","보톡스·필러","바디·웰니스 수액"],"trzh":["Ulthera·Sofwave·Thermage提升","皮肤·胶原蛋白助推","肉毒·玻尿酸","身体管理·营养输液"],"tren":["Ulthera·Sofwave·Thermage","Skin & Collagen Boosters","Botox·Filler","Body Care & Wellness IV"],"trja":["ウルセラ・ソフウェーブ・サーマジー","スキンブースター・コラーゲンブースター","ボトックス・フィラー","ボディ・ウェルネス点滴"],"loc":"서울 강남","loczh":"首尔江南","locen":"Gangnam, Seoul","locja":"ソウル江南","overview":"포브의원은 강남 언주로에 위치한 프라이빗 피부과로 2026년 9월 개원했습니다. \"Pain Off, Private On\"을 콘셉트로 통증 완화 프로토콜과 마주치지 않는 프라이빗 동선을 갖췄으며, 원장이 직접 진단·시술하는 울쎄라·소프웨이브·써마지 리프팅과 VIP 전용 공간을 운영합니다.","ovzh":"PO:VE皮肤科位于江南彦州路，是2026年9月开业的私密型皮肤科诊所。以\"Pain Off, Private On\"为理念，注重疼痛管理与不与他人照面的私密动线，由院长亲自问诊并进行Ulthera、Sofwave、Thermage等提升项目，设有VIP专属空间。","oven":"PO:VE Clinic, opened in September 2026 on Eonju-ro in Gangnam, is a private dermatology clinic built around \"Pain Off, Private On\" — pain-managed protocols, a no-crossing private flow, and doctor-led Ulthera, Sofwave and Thermage lifting with a dedicated VIP suite.","ovja":"PO:VE医院は江南・彦州路に位置するプライベート皮膚科で、2026年9月に開院しました。「Pain Off, Private On」をコンセプトに痛み緩和プロトコルと他の患者と顔を合わせないプライベート動線を備え、院長が直接診断・施術するウルセラ・ソフウェーブ・サーマジーのリフティングとVIP専用空間を運営しています。","doctors":["하재선 대표원장"]},{"name":"차이성형외과","zh":"CHAI整形外科","en":"CHAI Plastic Surgery","dept":"성형외과 (눈·코 특화)","deptzh":"整形外科 (眼鼻特化)","depten":"Plastic Surgery (Eye & Nose)","deptja":"形成外科(目・鼻特化)","cat":"성형외과","treats":["쌍꺼풀·눈매교정·트임","상·하안검·눈썹거상","코성형·재수술","리쥬란·보톡스·실리프팅"],"trzh":["双眼皮·眼型矫正·开眼角","上/下眼睑·提眉","鼻整形·修复手术","丽珠兰·肉毒·线雕提升"],"tren":["Double Eyelid & Eye Shape","Upper/Lower Blepharoplasty & Brow Lift","Rhinoplasty & Revision","Rejuran·Botox·Thread Lifting"],"trja":["二重・目つき矯正・目頭切開","上・下眼瞼・眉下切開","鼻整形・再手術","リジュラン・ボトックス・糸リフト"],"loc":"서울 강남","loczh":"首尔江南","locen":"Gangnam, Seoul","locja":"ソウル江南","overview":"차이성형외과는 강남역 인근(강남대로 406)의 눈·코 성형 특화 의원입니다. \"실력의 차이가 결과의 차이\"를 슬로건으로 최승호 대표원장이 직접 상담·집도하며, 쌍꺼풀·눈매교정·상하안검과 코 성형·재수술, 리쥬란·보톡스·실리프팅 등 시술을 함께 운영합니다.","ovzh":"CHAI整形外科位于江南站旁（江南大路406），是专注眼部·鼻部整形的诊所。以\"实力的差异成就结果的差异\"为理念，由代表院长崔承浩亲自面诊与主刀，提供双眼皮·眼型矫正·上下眼睑手术、鼻整形与修复手术，以及丽珠兰·肉毒等皮肤项目。","oven":"CHAI Plastic Surgery, near Gangnam Station (406 Gangnam-daero), specializes in eye and nose surgery. Under the motto \"the difference in skill makes the difference in results\", director Choi Seung-ho personally consults and operates — double eyelid, canthoplasty, blepharoplasty, primary and revision rhinoplasty, plus Rejuran, Botox and thread lifting.","ovja":"CHAI整形外科は江南駅近く(江南大路406)の目・鼻整形特化クリニックです。「実力の差が結果の差」をスローガンにチェ・スンホ代表院長が直接カウンセリング・執刀し、二重・目つき矯正・上下眼瞼と鼻整形・再手術、リジュラン・ボトックス・糸リフトなどの施術も行っています。","doctors":["최승호 대표원장"]},{"name":"강남JS병원","zh":"江南JS医院","en":"Gangnam JS Hospital","dept":"정형외과·신경외과","deptzh":"骨科·神经外科","depten":"Orthopedics · Neurosurgery","deptja":"整形外科・脳神経外科","cat":"정형외과","treats":["줄기세포 연골재생","척추내시경","전방십자인대 재건","BMAC 주사","인공관절"],"trzh":["干细胞软骨再生","脊柱内镜","前交叉韧带重建","BMAC注射","关节手术"],"tren":["Stem Cell Cartilage Regeneration","Endoscopic Spine Surgery","ACL Reconstruction","BMAC Injection","Joint Surgery"],"trja":["幹細胞軟骨再生","脊椎内視鏡","前十字靭帯再建","BMAC注射","人工関節"],"loc":"서울 강남","loczh":"首尔江南","locen":"Gangnam, Seoul","locja":"ソウル江南","overview":"강남JS병원(Gangnam JS Hospital)은 강남 도곡로에 위치한 척추·관절 전문병원으로, 대표원장 송준섭을 중심으로 줄기세포 연골재생(카티스템), 척추내시경 수술, 스포츠 손상·관절 치료를 전문으로 하며 국제환자 전담 진료를 제공합니다.","ovzh":"江南JS医院（Gangnam JS Hospital）位于首尔江南道谷路，是脊柱·关节专科医院，由代表院长宋俊燮领衔，专注于干细胞软骨再生（Cartistem）、脊柱内镜手术、运动损伤及关节治疗，设有国际患者专属诊疗服务。","oven":"Gangnam JS Hospital is a spine and joint specialty hospital in Dogok-ro, Gangnam, led by Dr. Song Jun-seob, specializing in stem cell cartilage regeneration (Cartistem), endoscopic spine surgery, and sports/joint treatment with a dedicated international patient service.","ovja":"江南JS病院は江南・道谷路に位置する脊椎・関節専門病院で、ソン・ジュンソプ代表院長を中心に幹細胞軟骨再生(カティステム)、脊椎内視鏡手術、スポーツ損傷・関節治療を専門とし、国際患者専任診療を提供しています。","doctors":["송준섭 대표원장","김나민 병원장","황윤하 진료원장","이선용 진료원장"]},{"name":"연세안마취통증의학과","zh":"延世安疼痛医学科","en":"Yonsei An Pain Clinic","dept":"마취통증의학과(비수술 통증치료)","deptzh":"麻醉疼痛医学科(非手术治疗)","depten":"Anesthesiology & Pain Medicine","deptja":"麻酔痛症医学科(非手術治療)","cat":"정형외과","treats":["신경차단·하이드로디섹션","도수치료","체외충격파","척추 감압치료","PDRN·프롤로 주사"],"trzh":["神经阻滞·神经水分离","徒手治疗","体外冲击波","脊柱减压治疗","PDRN·增生疗法注射"],"tren":["Nerve Block & Hydrodissection","Manual Therapy","ESWT (Shockwave)","Spinal Decompression","PDRN & Prolotherapy"],"trja":["神経ブロック・ハイドロダイセクション","徒手治療","体外衝撃波","脊椎減圧治療","PDRN・プロロ注射"],"loc":"경기 부천 역곡","loczh":"京畿富川·驿谷","locen":"Yeokgok, Bucheon","locja":"富川・駅谷","overview":"연세안마취통증의학과(Yonsei An Pain Clinic)는 1호선 역곡역 1번 출구 앞 역곡유림빌딩 3층에 위치한 통증 전문 의원입니다. 통증의학과·신경외과·정형외과 의료진이 협진하며, 정밀 초진 평가(X-ray·뇌파·맥파 검사) 후 신경차단·도수치료·체외충격파·척추 감압 등 비수술 맞춤 치료를 제공합니다. 영어 의료통역이 상주하고 공항 픽업과 국제보험 청구 서류를 지원합니다.","ovzh":"延世安疼痛医学科（Yonsei An Pain Clinic）位于富川驿谷站1号出口旁驿谷儒林大厦3层，是疼痛专科医院。疼痛医学科·神经外科·骨科医生联合诊疗，经精密初诊评估（X光·脑电波·脉搏检查）后提供神经阻滞·徒手治疗·体外冲击波·脊柱减压等非手术个性化治疗。常驻英文医疗翻译，支持机场接机及国际保险理赔材料。","oven":"Yonsei An Pain Clinic is a pain-medicine specialty clinic on the 3rd floor of Yeokgok Yurim Bldg., right by Exit 1 of Yeokgok Station (Line 1), Bucheon. A multidisciplinary team of pain medicine, neurosurgery and orthopedics provides non-surgical personalized care — nerve blocks, manual therapy, ESWT and spinal decompression — after a precise initial assessment. English medical interpreter on site; airport pickup and international insurance paperwork supported.","ovja":"延世安ペインクリニックは1号線・駅谷駅1番出口前のビル3階に位置する痛み治療専門クリニックです。ペインクリニック・脳神経外科・整形外科の医師が連携し、精密初診評価の後、神経ブロック・徒手治療・体外衝撃波・脊椎減圧など非手術のオーダーメイド治療を提供します。英語医療通訳が常駐し、空港送迎や国際保険書類にも対応します。","doctors":["조남룡 대표원장","김지웅 원장","이지은 원장","송신미 원장","김계숙 원장","이상은 원장","최영서 원장","박해리 원장","최낙철 원장"]},{"name":"멜로우피부과의원 청담점","zh":"Mellow皮肤科(清潭店)","en":"Mellow Dermatology Clinic Cheongdam","dept":"피부과","deptzh":"皮肤科","depten":"Dermatology","deptja":"皮膚科","cat":"피부","treats":["써마지·울쎄라피 프라임","온다·소프라노 티타늄","스킨부스터·리쥬란","보톡스·필러","피코토닝·색소"],"trzh":["热玛吉·超声炮Prime","ONDA·Soprano","皮肤管理·丽珠兰","肉毒素·玻尿酸","皮秒净肤·色素"],"tren":["Thermage & Ultherapy Prime","ONDA & Soprano Titanium","Skin Boosters & Rejuran","Botox & Filler","Pico Toning & Pigment"],"trja":["サーマジー・ウルセラピープライム","ONDA・ソプラノ","スキンブースター・リジュラン","ボトックス・フィラー","ピコトーニング・色素"],"loc":"서울 청담","loczh":"首尔清潭","locen":"Cheongdam, Seoul","locja":"ソウル清潭","overview":"멜로우피부과의원 청담점(Mellow Dermatology Clinic)은 도산대로 429에 위치한 피부과 전문 의원입니다. 대표원장 박복원을 중심으로 써마지·울쎄라피 프라임·온다 등 리프팅과 멜로우부스터·리투오·레이어드 프로그램 등 맞춤 스킨부스터, 4개 브랜드 보톡스와 필러, 피코토닝 색소치료·제모까지 폭넓은 피부 프로그램을 운영합니다. 금요일 야간(21시)·토요일 진료로 방문이 편리합니다.","ovzh":"Mellow皮肤科清潭店位于岛山大路429号，是皮肤科专科医院，由代表院长朴福源主诊。提供热玛吉·超声炮Prime·ONDA等提升项目、Mellow定制水光·Re2O·分层水光等皮肤管理，四大品牌肉毒素与玻尿酸填充、皮秒净肤色素治疗及脱毛等全方位皮肤项目。周五夜间(21点)·周六也可就诊。","oven":"Mellow Dermatology Clinic Cheongdam, at 429 Dosan-daero, is a dermatology specialty clinic led by Dr. Park Bok-won. It offers lifting (Thermage, Ultherapy Prime, ONDA), customized skin boosters (Mellow Booster, Re2O, layered programs), four brands of botulinum toxin, fillers, pico toning for pigmentation, and hair removal. Open late on Fridays (9pm) and on Saturdays.","ovja":"メロウ皮膚科クリニック清潭店は島山大路429に位置する皮膚科専門クリニックです。パク・ボクウォン代表院長のもと、サーマジー・ウルセラピープライム・ONDAなどのリフティング、メロウブースター・Re2Oなどのオーダーメイドスキンブースター、4ブランドのボトックス・フィラー、ピコトーニングによる色素治療・脱毛まで幅広く提供します。金曜夜間(21時)・土曜診療。","doctors":["박복원 대표원장"]},{"name":"더플러스성형외과","zh":"THE PLUS整形外科","en":"THE PLUS Plastic Surgery","dept":"성형외과(코 재건 특화)","deptzh":"整形外科(鼻部再造)","depten":"Plastic Surgery (Nasal Reconstruction)","deptja":"整形外科(鼻再建)","cat":"성형외과","treats":["코 재건술","코 재수술","코성형","안면윤곽","눈성형"],"trzh":["鼻部再造手术","鼻修复手术","鼻整形","面部轮廓","眼部整形"],"tren":["Nasal Reconstruction","Revision Rhinoplasty","Rhinoplasty","Facial Contouring","Eye Surgery"],"trja":["鼻再建術","鼻再手術","鼻整形","輪郭形成","目の整形"],"loc":"서울 신사 가로수길","loczh":"首尔新沙·林荫路","locen":"Garosu-gil, Sinsa, Seoul","locja":"ソウル新沙・カロスキル","overview":"더플러스성형외과(THE PLUS Plastic Surgery)는 신사 가로수길에 위치한 성형외과로, 코 재건술·코 재수술 등 난도 높은 코 수술에 특화되어 있습니다. 정재용 원장을 비롯한 성형외과 의료진이 직접 상담·집도하며, 안면윤곽·눈·가슴 성형도 함께 진료합니다. 영어·중국어·일본어·러시아어·태국어 사이트를 운영할 만큼 해외환자 진료 경험이 풍부합니다.","ovzh":"THE PLUS整形外科位于新沙洞林荫路，专注高难度鼻部手术——鼻部再造与鼻修复手术，同时开展面部轮廓·眼部·胸部整形。由郑在容院长等专科医生亲自面诊与主刀，运营英·中·日·俄·泰多语官网，国际患者诊疗经验丰富。","oven":"THE PLUS Plastic Surgery, on Garosu-gil in Sinsa, specializes in advanced nose surgery — nasal reconstruction and revision rhinoplasty — alongside facial contouring, eye and breast surgery. Led by Dr. Jung Jae-yong, the clinic has extensive experience with international patients, running dedicated English, Chinese, Japanese, Russian and Thai websites.","ovja":"ザ・プラス整形外科は新沙・カロスキルに位置し、鼻再建術・鼻再手術など難易度の高い鼻手術に特化しています。チョン・ジェヨン院長をはじめとする専門医が直接カウンセリング・執刀し、輪郭・目・胸の手術にも対応。英・中・日・露・タイ語サイトを運営するなど海外患者の診療経験が豊富です。","doctors":["정재용 원장"]},{"name":"아도의원","zh":"ADO皮肤科","en":"ADO Clinic","dept" function addKwChip(el){ addKwPair(el.getAttribute('data-l'), el.getAttribute('data-v')); }
function addKwPair(l,v){
  l=(l||'').trim(); v=(v||l).trim(); if(!l)return;
  var i=KWS.findIndex(function(k){return k.v===v;});
  if(i>=0)KWS.splice(i,1); else KWS.push({l:l,v:v}); // 다시 누르면 해제
  renderKws(); renderQuick();
}
function addKw(){ var v=document.getElementById('kwq').value.trim(); if(v){addKwPair(v,v);document.getElementById('kwq').value='';} }

  document.getElementById('kws').innerHTML=KWS.map(function(k,i){return '<span class="kw">'+esc(k.l)+'<b onclick="delKw('+i+')">✕</b></span>';}).join('');
  document.getElementById('toStep2').disabled=!KWS.length;
}
function goStep(n){
  for(var i=1;i<=5;i++){
    var p=document.getElementById('p'+i); if(p)p.classList.toggle('on',i===n);
    var s=document.getElementById('stp'+i); if(s)s.classList.toggle('on',i===n);
  }
  document.getElementById('quote').scrollIntoView({behavior:'smooth'});
}
function itemText(i){return (i.ko+' '+(i.zh||'')+' '+i.cat).toLowerCase();}
function itemLabel(i){return (LANG==='zh'&&i.zh)?i.zh:i.ko;}
function quoteAll(){
  return HOSPS.map(function(h){
    var sum=0,hit=0,lines=[];
    KWS.forEach(function(kwo){
      var k=kwo.v.toLowerCase();
      var m=h.items.filter(function(i){return itemText(i).indexOf(k)>=0;});
      if(m.length){var best=m.reduce(function(a,b){return a.krw<=b.krw?a:b;});hit++;sum+=best.krw;lines.push({kw:kwo.l,it:best});}
      else lines.push({kw:kwo.l,it:null});
    });
    return {anon:h.anon,vat:h.vat_note,sum:sum,hit:hit,lines:lines};
  }).filter(function(q){return q.hit>0;})
    .sort(function(a,b){return (b.hit-a.hit)||(a.sum-b.sum);});
}
function goStep2(){
  var t=T();
  var qs=quoteAll();
  var box=document.getElementById('qcards');
  if(!qs.length){box.innerHTML='<div style="text-align:center;color:#94a3b8;padding:26px;font-size:13px;">'+esc(t.qcNone)+'</div>';}
  else{
    box.innerHTML=qs.map(function(q){
      return '<div class="qcard'+(PREFER===q.anon?' on':'')+'" data-anon="'+q.anon+'" onclick="pickQ(this)">'
        +'<div class="row"><span class="anm">'+q.anon+'<span class="tag">'+esc(t.qcTag.replace('{h}',q.hit).replace('{t}',KWS.length))+'</span></span>'
        +'<span class="amt">'+won(q.sum)+(q.vat?'<span class="u"> ('+esc(q.vat)+')</span>':'')+'</span></div>'
        +'<div class="det">'+q.lines.map(function(l){return l.it?('· '+esc(l.kw)+' → '+esc(itemLabel(l.it))+' <b>'+won(l.it.krw)+'</b>'):('· '+esc(l.kw)+' → '+esc(t.qcMiss));}).join('<br>')+'</div>'
        +'</div>';
    }).join('');
  }
  goStep(2);
}
function pickQ(el){
  var a=el.getAttribute('data-anon');

  PREFER=a;
  document.querySelectorAll('.qcard').forEach(function(c){c.classList.toggle('on',c===el);});
}
function togT(el){
  var t=el.getAttribute('data-t');

  else{SEL_TRAITS.push(t);el.classList.add('on');}
}
function resetWizard(){
  KWS=[]; SEL_TRAITS=[]; PREFER=''; ELIG='';
  renderKws(); renderQuick();
  document.querySelectorAll('.topt').forEach(function(e){e.classList.remove('on');});
  document.getElementById('qcards').innerHTML='';
  ['f-name','f-phone','f-memo','kwq'].forEach(function(id){var e=document.getElementById(id);if(e)e.value='';});
  document.getElementById('werr').textContent='';
  goStep(1);
}
function submitMatch(){
  var t=T();
  var name=document.getElementById('f-name').value.trim();
  var phone=document.getElementById('f-phone').value.trim();
  var err=document.getElementById('werr'); err.textContent='';
  if(!name||!phone){err.textContent=t.errNeed;return;}
  if(!ELIG){err.textContent=t.eligNeed;return;}
  var btn=document.getElementById('submitBtn'); btn.disabled=true; btn.textContent=t.submitting;
  fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({picks:KWS.map(function(k){return {kw:k.v};}),traits:SEL_TRAITS,prefer_anon:PREFER,name:name,phone:phone,memo:document.getElementById('f-memo').value.trim(),lang:LANG,elig:ELIG})
  }).then(function(r){return r.json();}).then(function(d){
    btn.disabled=false; btn.textContent=t.submit;
    if(d&&d.ok&&d.hospital){
      document.getElementById('r-hosp').textContent=d.hospital;
      // 내국인·건보가입자: 정보 안내만 (상담 연결·문자 없음)
      if(d.info_only){
        document.getElementById('t-r-title').textContent=t.rTitleInfo;
        document.getElementById('t-r-sub').innerHTML=t.rSubInfo;
      }else{
        document.getElementById('t-r-title').textContent=t.rTitle;
        document.getElementById('t-r-sub').innerHTML=t.rSub;
      }
      goStep(5);
    }else if(d&&d.error==='no_match'){ err.textContent=t.errNoMatch; }
    else{ err.textContent=t.errRetry; }
  }).catch(function(){
    btn.disabled=false; btn.textContent=t.submit;
    err.textContent=t.errNet;
  });
}
applyLang(LANG);
window.addEventListener('scroll',function(){var b=document.getElementById('totop');if(b)b.classList.toggle('on',window.scrollY>500);},{passive:true});
</script>
