        '双方不得向第三方泄露本协议内容、介绍费费率、客户信息及医疗机构价格信息等，该义务在协议终止后继续存续3年。')

        '本协议适用大韩民国法律。争议应通过友好协商解决；协商不成的，依据大韩商事仲裁院（KCAB）仲裁规则在首尔仲裁并终局解决。')
    +sec('제 13 조 (기타) / 第十三条 (其他)')
    +pr('1. 본 계약은 국문과 중문으로 작성하며, 해석상 불일치가 있는 경우 국문을 우선한다. 2. 본 계약에 정하지 아니한 사항은 양 당사자가 협의하여 정한다. 3. 본 계약은 2부를 작성하여 각 1부씩 보관한다.',
        '1. 本协议以韩文及中文书就，解释存在歧义时以韩文为准。2. 本协议未尽事宜由双方协商确定。3. 本协议正本两份，双方各持一份。')
    +'<div style="text-align:center;font-size:12px;font-weight:700;margin:16px 0 14px;">'+dKo+' / '+dZh+'</div>'
    +'<div style="display:flex;gap:18px;flex-wrap:wrap;font-size:10.5px;">'
    +'<div style="flex:1;min-width:250px;border:1px solid #e2e8f0;border-radius:8px;padding:10px 12px;">'
      +'<div style="font-weight:800;margin-bottom:5px;">[갑] (甲方 / Party A)</div>'

      +fld('담당자 (联系人)',p.conA)+fld('연락처 (电话)',p.phoneA)
      +'<div style="margin-top:6px;">대표자 (代表者): <b>하장환</b>  (인)(印)</div>'
      +(p.signA?'<img src="'+p.signA+'" style="height:50px;margin-top:2px;">':'<div style="height:50px;"></div>')+'</div>'

function fullHtml(p){
  return '<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>境外客源介绍服务合同 — '+esc(p.cn)+'</title></head><body style="margin:0;background:#fff;">'+buildDoc(p)+'</body></html>';
}
function b64uDec(s){ s=s.replace(/-/g,'+').replace(/_/g,'/'); while(s.length%4)s+='='; return decodeURIComponent(escape(atob(s))); }
function qs(n){ var m=location.search.match(new RegExp('[?&]'+n+'=([^&]+)')); return m?m[1]:null; }
function randKey(){ var a=new Uint8Array(16); crypto.getRandomValues(a); return Array.prototype.map.call(a,function(b){return ('0'+b.toString(16)).slice(-2);}).join(''); }
function dl(name,html){ var a=document.createElement('a'); a.href='data:text/html;base64,'+btoa(unescape(encodeURIComponent(html))); a.download=name; document.body.appendChild(a); a.click(); a.remove(); }

var P=null, app=document.getElementById('app');

/* ── 열람 모드 (?v=키): 완료된 계약서 ── */
var vkey=qs('v');
if(vkey){
  fetch(SUPA_URL+'/rest/v1/rpc/ta_contract_html',{method:'POST',headers:{apikey:SUPA_KEY,Authorization:'Bearer '+SUPA_KEY,'Content-Type':'application/json'},body:JSON.stringify({p_key:vkey})})
  .then(function(r){return r.json();})
  .then(function(j){
    if(!j||!j.html){app.innerHTML='<div class="card err">未找到合同。(계약서를 찾을 수 없습니다)</div>';return;}
    window._viewHtml=j.html; window._viewName='合同_'+(j.agency_name||'contract')+'.html';
    app.innerHTML='<div class="card"><div class="ok" style="margin-bottom:8px;">✓ 已签署合同 (서명 완료된 계약서)</div>'
      +'<div style="display:flex;gap:8px;margin-bottom:10px;"><button class="btn primary" onclick="dl(window._viewName,window._viewHtml)">保存合同文件 (다운로드)</button><button class="btn" onclick="window.print()">打印 (인쇄)</button></div>'
      +'<div class="doc" style="max-height:none;" id="vdoc"></div></div>';
    var ifr=document.createElement('iframe'); ifr.style.cssText='width:100%;height:1200px;border:0;'; document.getElementById('vdoc').appendChild(ifr);
    ifr.srcdoc=j.html;
  })
  .catch(function(e){app.innerHTML='<div class="card err">加载失败: '+esc(e.message)+'</div>';});
}else{
/* ── 서명 모드 (?d=파라미터 / 파라미터 없으면 공란 신규 — 브로슈어 QR용) ── */
var dRaw=qs('d');
if(dRaw){ try{ P=JSON.parse(b64uDec(dRaw)); }catch(e){} }
else { P={aid:null,cn:'',en:'',reg:'',addr:'',rate:'20',cur:'CNY',stmtDay:'10',payDays:'5',conA:'손이나 (孙依娜)',phoneA:'+86 158-5812-2829',conB:'',phoneB:'',bank:'',swift:'',account:'',legalRep:''}; }
if(!P||(dRaw&&!P.cn)){
  app.innerHTML='<div class="card err">链接无效。请向 FOLLOW KOREA 负责人索取新的二维码。<div class="muted" style="margin-top:4px;">링크가 유효하지 않습니다. 담당자에게 새 QR을 요청하세요.</div></div>';
}else{
  P.date=P.date||new Date().toISOString().slice(0,10);
  app.innerHTML=''
  +'<div class="card"><div style="font-weight:800;font-size:14px;">'+(P.cn?esc(P.cn):'旅行社合作协议 · 在线签署')+'</div><div class="muted">请确认以下合同内容 (아래 계약 내용을 확인하세요) · 介绍费 <b>'+esc(P.rate)+'%</b> · '+esc(P.cur)+(P.cn?'':'<br>请在下方填写贵社信息后签字提交。(아래에 회사 정보를 입력 후 서명하세요)')+'</div></div>'
  +'<div class="card"><div class="doc" id="doc"></div></div>'
  +'<div class="card"><div style="font-weight:800;font-size:13px;margin-bottom:4px;">乙方信息 (을방 정보)</div>'
    +'<div class="grid">'
    +'<div><label>公司名 (상호명) *</label><input id="f-cn"></div>'
    +'<div><label>统一社会信用代码</label><input id="f-reg"></div>'
    +'<div style="grid-column:1/-1;"><label>地址 (주소)</label><input id="f-addr"></div>'
    +'<div><label>联系人 (담당자)</label><input id="f-conb"></div>'
    +'<div><label>电话 (연락처)</label><input id="f-phoneb"></div>'
    +'<div><label>开户银行</label><input id="f-bank"></div>'
    +'<div><label>SWIFT</label><input id="f-swift"></div>'
    +'<div style="grid-column:1/-1;"><label>账号 (계좌번호)</label><input id="f-account"></div>'
    +'<div><label>法定代表人 (법정대표인) *</label><input id="f-legal"></div>'
    +'</div></div>'
  +'<div class="card"><div style="display:flex;justify-content:space-between;align-items:center;"><div style="font-weight:800;font-size:13px;">签字 (서명) *</div><button class="btn" style="padding:5px 12px;font-size:12px;" onclick="padClear()">重写 (지우기)</button></div>'
    +'<div class="muted" style="margin:4px 0 6px;">请法定代表人在下方框内签字 (법정대표인이 아래에 서명하세요)</div>'
    +'<canvas id="pad" class="pad" width="640" height="200"></canvas></div>'
  +'<div class="card"><button class="btn primary block" id="submit-btn" onclick="submitSign()">提交签署 (서명 제출)</button><div class="muted" style="margin-top:6px;text-align:center;">提交后合同自动发送至 FOLLOW KOREA。(제출 시 계약서가 팔로우코리아로 전송됩니다)</div></div>';
  ['cn','reg','addr'].forEach(function(k){document.getElementById('f-'+k).value=P[k]||'';});
  document.getElementById('f-conb').value=P.conB||'';
  document.getElementById('f-phoneb').value=P.phoneB||'';
  document.getElementById('f-bank').value=P.bank||'';
  document.getElementById('f-swift').value=P.swift||'';
  document.getElementById('f-account').value=P.account||'';
  document.getElementById('f-legal').value=P.legalRep||'';
  renderDoc();
  ['f-cn','f-reg','f-addr','f-conb','f-phoneb','f-bank','f-swift','f-account','f-legal'].forEach(function(id){document.getElementById(id).addEventListener('input',renderDoc);});
  // 서명 패드
  (function(){
    var cv=document.getElementById('pad'),ctx=cv.getContext('2d');
    ctx.lineWidth=2.8;ctx.lineCap='round';ctx.lineJoin='round';ctx.strokeStyle='#111827';
    var draw=false,last=null;
    function pos(e){var r=cv.getBoundingClientRect();return {x:(e.clientX-r.left)*cv.width/r.width,y:(e.clientY-r.top)*cv.height/r.height};}
    cv.addEventListener('pointerdown',function(e){draw=true;last=pos(e);cv._dirty=true;try{cv.setPointerCapture(e.pointerId);}catch(x){}e.preventDefault();});
    cv.addEventListener('pointermove',function(e){if(!draw)return;var p2=pos(e);ctx.beginPath();ctx.moveTo(last.x,last.y);ctx.lineTo(p2.x,p2.y);ctx.stroke();last=p2;e.preventDefault();});
    ['pointerup','pointercancel','pointerleave'].forEach(function(ev){cv.addEventListener(ev,function(){draw=false;});});
  })();
}
}
function curP(withSign){
  var g=function(id){return (document.getElementById(id)||{value:''}).value.trim();};
  var cv=document.getElementById('pad');
  return {cn:g('f-cn'),en:P.en||'',reg:g('f-reg'),addr:g('f-addr'),
    rate:P.rate,cur:P.cur,stmtDay:P.stmtDay,payDays:P.payDays,date:P.date,
    conA:P.conA||'',phoneA:P.phoneA||'',conB:g('f-conb'),phoneB:g('f-phoneb'),
    bank:g('f-bank'),swift:g('f-swift'),account:g('f-account'),legalRep:g('f-legal'),
    signA:null,signB:(withSign&&cv&&cv._dirty)?cv.toDataURL('image/png'):null};
}
function renderDoc(){ document.getElementById('doc').innerHTML=buildDoc(curP(false)); }
function padClear(){ var cv=document.getElementById('pad'); cv.getContext('2d').clearRect(0,0,cv.width,cv.height); cv._dirty=false; }
function submitSign(){
  var p=curP(true);
  if(!p.cn){alert('请填写公司名 (상호명을 입력하세요)');return;}
  if(!p.legalRep){alert('请填写法定代表人 (법정대표인을 입력하세요)');return;}
  if(!p.signB){alert('请先签字 (먼저 서명해 주세요)');return;}
  var btn=document.getElementById('submit-btn'); btn.disabled=true; btn.textContent='提交中…';
  var html=fullHtml(p), key=randKey();
  var dd=JSON.parse(JSON.stringify(p)); delete dd.signA; delete dd.signB;
  fetch(SUPA_URL+'/rest/v1/ta_contracts',{method:'POST',headers:{apikey:SUPA_KEY,Authorization:'Bearer '+SUPA_KEY,'Content-Type':'application/json',Prefer:'return=minimal'},
    body:JSON.stringify({agency_id:P.aid||null,agency_name:p.cn,data:dd,html:html,processed:false,view_key:key})})
  .then(function(r){
    if(!r.ok)throw new Error('HTTP '+r.status);
    window._doneHtml=html; window._doneName='合同_'+p.cn+'_'+p.date+'.html';
    var vurl=location.origin+location.pathname+'?v='+key;
    app.innerHTML='<div class="card" style="text-align:center;">'
      +'<div style="font-size:40px;">✅</div><div class="ok" style="font-size:16px;">签署完成！(서명 완료)</div>'
      +'<div class="muted" style="margin:6px 0 12px;">合同已发送至 FOLLOW KOREA。您可保存合同副本：<br>계약서가 팔로우코리아로 전송되었습니다. 사본을 보관하세요.</div>'
      +'<button class="btn primary block" onclick="dl(window._doneName,window._doneHtml)" style="margin-bottom:8px;">保存合同文件 (계약서 다운로드)</button>'
      +'<div class="muted" style="word-break:break-all;">合同查看链接 (열람 링크):<br><a href="'+vurl+'">'+vurl+'</a><br>可收藏或转发到微信保存。(위챗에 전달해 보관할 수 있습니다)</div></div>';
    window.scrollTo(0,0);
  })
  .catch(function(e){ btn.disabled=false; btn.textContent='提交签署 (서명 제출)'; alert('提交失败，请重试。(제출 실패: '+e.message+')'); });
}
