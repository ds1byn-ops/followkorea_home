# Netlify deployment configuration for Follow Korea
# https://docs.netlify.com/configure-builds/file-based-configuration/

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# 여행사 전자계약 서명 페이지 — 브로슈어 QR용 짧은 주소 (같은 도메인에서 직접 서빙 — netlify.app 리다이렉트는 위챗/중국망에서 인증서 경고 발생)
[[redirects]]
  from = "/sign"
  to = "/sign.html"
  status = 200
  force = true

# Single-page app: serve index.html for any unmatched path
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# 보안 헤더 (클릭재킹/MIME 스니핑/레퍼러 정책)
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), camera=(), microphone=(), payment=()"
