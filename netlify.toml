# Netlify deployment configuration for Follow Korea
# https://docs.netlify.com/configure-builds/file-based-configuration/

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# 여행사 전자계약 서명 페이지 (펄스 sign.html) — 브로슈어 QR용 짧은 주소
[[redirects]]
  from = "/sign"
  to = "https://followkorea.netlify.app/sign.html"
  status = 302
  force = true

# Single-page app: serve index.html for any unmatched path
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# 보안 헤더 (클릭재킹/MIME 스니핑/레퍼러 정책)
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), camera=(), microphone=(), payment=()"
